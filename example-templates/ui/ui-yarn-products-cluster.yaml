name: Build and Deploy
'on':
  pull_request_review:
    types: [ submitted ]
  push:
    tags:
      - '*'
    branches:
      - main
jobs:
  build:
    uses: zopsmart/zs-workflows/.github/workflows/ui_yarn_build.yaml@v0.3.6
    with:
      APP_NAME: smart-quiz-admin-ui
      NODE_VERSION: '16.x'
      BUILD_COMMAND: |
        CI=false yarn run build
        tar -zcf smart-quiz-admin-ui.zip build
      TEST_COMMAND: |
        CI=false yarn test:coverage
      ARTIFACT_PATH: |
        smart-quiz-admin-ui.zip
        node_modules.zip
      LINTER_CHECKS: 'to enable linter checks, default is true'
      PRETTIER_CHECKS: 'to enable prettier, default is true'
      ENABLE_TESTS: 'to create coverage badge, default is true'
    secrets:
      PAT: '${{ secrets.GITHUB_TOKEN }}'

  stage_deployment:
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - DOCKER_FILE_PATH: Dockerfile
            app_name: smart-quiz-admin-ui
            namespace: quizzing-pro-stage
            type: deployment
    uses: zopsmart/zs-workflows/.github/workflows/ui_stage_deploy.yaml@v0.3.6
    with:
      DOCKER_FILE_PATH: '${{ matrix.DOCKER_FILE_PATH }}'
      BUILD_ARGUMENTS: |
        VERSION=edge
        APP_NAME=main
      APP_NAME: '${{ matrix.app_name }}'
      NAMESPACE: '${{ matrix.namespace }}'
      IMAGE_REGISTRY: us-central1-docker.pkg.dev  #GAR registry
      username: _json_key
      GCR_PROJECT: zs-products
      CLUSTER_NAME: products-cluster
      CLUSTER_PROJECT: zs-products
      SHA: '${{ needs.build.outputs.SHA }}'
      TYPE: '${{ matrix.type }}'
      ENV_FILE_PATH: ./configs/.stage.env
      UNZIP_COMMAND: |
        tar -xf smart-quiz-admin-ui.zip
        tar -xf node_modules.zip
    secrets:
      GCR_KEY: '${{ secrets.GCR_JSON_KEY }}'
      DEPLOY_KEY: '${{ secrets.DEPLOY_KEY }}'
  prod_deployment:
    strategy:
      fail-fast: false
      matrix:
        include:
          - DOCKER_FILE_PATH: Dockerfile
            app_name: smart-quiz-admin-ui
            namespace: quizzing-pro-stage
            type: deployment
    uses: zopsmart/zs-workflows/.github/workflows/gcr_prod_deploy.yaml@v0.3.6
    with:
      IMAGE_REGISTRY: us-central1-docker.pkg.dev  #GAR registry
      username: _json_key
      GCR_PROJECT: zs-products
      APP_NAME: '${{ matrix.app_name }}'
      CLUSTER_NAME: products-cluster
      NAMESPACE: '${{ matrix.namespace }}'
      CLUSTER_PROJECT: zs-products
      TYPE: '${{ matrix.type }}'
      ENV_FILE_PATH: ./configs/.prod.env
    secrets:
      GCR_KEY: '${{ secrets.GCR_JSON_KEY }}'
      DEPLOY_KEY: '${{ secrets.DEPLOY_KEY }}'
