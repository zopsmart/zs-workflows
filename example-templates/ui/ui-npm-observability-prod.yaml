name: Build and Deploy

on:
  pull_request_review:
    types: [ submitted ]
    branches:
      - main
  push:
    tags:
      - '*'
    branches:
      - main

jobs:
  build:
    uses: zopsmart/zs-workflows/.github/workflows/ui_npm_build.yaml@v0.3.6
    with:
      APP_NAME: ${{ vars.PROD_APP_NAME }}
      NODE_VERSION: '18.x'
      DEPENDENCIES_FLAG: --legacy-peer-deps
      BUILD_COMMAND: |
        commands to build
      TEST_COMMAND: |
        CI=false npm run test:coverage
      ARTIFACT_PATH: | 
        based on build command e.g - 
        zs-cloud-ui.zip
        node_modules.zip
      LINTER_CHECKS: true
      PRETTIER_CHECKS: true
      ENABLE_TESTS: false
    secrets:
      PAT: '${{ secrets.PAT }}'

  stage_deployment:
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - DOCKER_FILE_PATH: .
            app_name: ${{ vars.STAGE_APP_NAME }}
            namespace: ${{ vars.STAGE_NAMESPACE }}

    uses: zopsmart/zs-workflows/.github/workflows/ui_gar_stage_deploy.yaml@v0.3.6
    with:
      DOCKER_FILE_PATH: '${{ matrix.DOCKER_FILE_PATH }}'
      BUILD_ARGUMENTS: |
        VERSION=edge
        APP_NAME=main
      APP_NAME: '${{ matrix.app_name }}'
      NAMESPACE: '${{ matrix.namespace }}'
      IMAGE_REGISTRY: us-central1-docker.pkg.dev
      GAR_PROJECT: ${{ vars.STAGE_GAR_PROJECT }}
      GAR_REGISTRY: ${{ vars.STAGE_GAR_REGISTRY }}
      CLUSTER_NAME: ${{ vars.STAGE_CLUSTER_NAME }}
      CLUSTER_PROJECT: ${{ vars.STAGE_CLUSTER_PROJECT }}
      HELM_VALUES_PATH: './helm-values/stage.yaml'
      ENV_FILE_PATH: ./configs/.stage.env
      SHA: '${{ needs.build.outputs.SHA }}'
      UNZIP_COMMAND: |
        based on artifact path
        tar -xf zs-cloud-ui.zip
        tar -xf node_modules.zip
    secrets:
      GAR_KEY: '${{ secrets.STAGE_DEPLOY_KEY }}'
      PAT: '${{ secrets.STAGE_PAT }}'
  prod_deployment:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: ${{ vars.PROD_APP_NAME }}
            namespace: ${{ vars.PROD_NAMESPACE }}
    uses: zopsmart/zs-workflows/.github/workflows/go_gar_prod_deploy.yaml@v0.3.6
    with:
      IMAGE_REGISTRY: us-central1-docker.pkg.dev
      GAR_PROJECT: ${{ vars.PROD_GAR_PROJECT }}
      GAR_REGISTRY: ${{ vars.PROD_GAR_REGISTRY }}
      APP_NAME: '${{ matrix.app_name }}'
      CLUSTER_NAME: ${{ vars.PROD_CLUSTER_NAME }}
      CLUSTER_PROJECT: ${{ vars.PROD_CLUSTER_PROJECT }}
      HELM_VALUES_PATH: './helm-values/prod.yaml'
      NAMESPACE: '${{ matrix.namespace }}'
      ENV_FILE_PATH: ./configs/.prod.env
    secrets:
      GAR_KEY: '${{ secrets.STAGE_DEPLOY_KEY }}'
      PAT: '${{ secrets.PROD_PAT }}'
