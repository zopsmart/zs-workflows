name: Go - Lint, Test & Build

on:
  pull_request:
    types: [review_requested]
    branches:
      - main
      - master
      - development
  push:
    tags:
      - '*'
    branches:
      - main
      - master
      - development

jobs:
  build:
    uses: zopsmart/zs-workflows/.github/workflows/go.yaml@main
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: ${{ vars.STAGE_APP_NAME }}
            stage_namespace: ${{ vars.STAGE_NAMESPACE }}
            prod_namespace: ${{ vars.PROD_NAMESPACE }}
            build_commands: "<build command>"
            DOCKER_FILE_PATH: "." # add step to grant executable permission to binary in docker file ex. chmod 777 /main
    with:
      POSTMAN_ENABLED: false
      TESTCOVERAGE_THRESHOLD: 10
      APP_NAME: ${{ matrix.app_name }} #postman collection should have file structure - postman-collections/<APP_NAME>.postman-collection.json
      ADD_SCHEMA: "true or false, if true must provide schema command"
      SCHEMA_COMMAND: "command to load schema to database,
                      mysql - host = 127.0.0.1, user = root , password = password, database test
                      postgres - host = 127.0.0.1, user = postgres, password = password, database test"
      EXTRA_DEPENDENCIES: "ture or false , to load extra dependencies"
      DEPENDENCIES_COMMAND: |
        "commands to install dependencies"
        ""
      MYSQL_ENABLE: "to enable MYSQL service"
      POSTGRES_ENABLE: "to enable POSTGRES service"
      REDIS_ENABLE: "to enable REDIS service"
      ZIPKIN_ENABLE: "to enable ZIPKIN service"
      ELASTIC_SEARCH_ENABLE: "to enable ELASTIC_SEARCH service"
      KAFKA_ENABLE: "to enable KAFKA service"
      MONGO_ENABLE: "to enable MONGO service"
      MSSQL_ENABLE: "to enable MSSQL service"
      DYNAMODB_ENABLE: "to enable DYNAMODB service"
      CASSANDRA_ENABLE: "to enable CASSANDRA service"
      BUILD_COMMAND: ${{ matrix.build_commands }}
      BUILD_ARGUMENTS: |
        VERSION=edge
        APP_NAME=main
      IMAGE_REGISTRY: us-central1-docker.pkg.dev
      GAR_PROJECT: ${{ vars.STAGE_GAR_PROJECT }}
      GAR_REGISTRY: ${{ vars.STAGE_GAR_REGISTRY }}
      CLUSTER_PROJECT: ${{ vars.STAGE_CLUSTER_PROJECT }}
      CLUSTER_NAME: ${{ vars.STAGE_CLUSTER_NAME }}
      STAGE_NAMESPACE: ${{ matrix.stage_namespace }}
      PROD_NAMESPACE: ${{ matrix.prod_namespace }}
      STAGE_ENV_FILE_PATH: ./configs/.stage.env
      PROD_ENV_FILE_PATH: ./configs/.prod.env
      DOCKER_FILE_PATH: ${{ matrix.DOCKER_FILE_PATH }}
      REACT_APP:  # true if its react service, default is false skip this if not a react service
    secrets:
      PAT: ${{ secrets.PAT }} // not a mandatory field
      GAR_KEY: ${{ secrets.GAR_KEY }}


  stage_deployment:
    needs: [ build ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: ${{ vars.STAGE_APP_NAME }}
            namespace: ${{ vars.STAGE_NAMESPACE }}
            type: "deployment"
            deployment_tool: "helm" #deployment tool to use for deploying the application either helm or kubectl
    uses: zopsmart/zs-workflows/.github/workflows/stage_deploy.yaml@main
    with:
      APP_NAME: ${{ matrix.app_name }}
      NAMESPACE: ${{ matrix.namespace }}
      IMAGE_REGISTRY: us-central1-docker.pkg.dev
      GAR_PROJECT: ${{ vars.STAGE_GAR_PROJECT }}
      GAR_REGISTRY: ${{ vars.STAGE_GAR_REGISTRY }}
      CLUSTER_PROJECT: ${{ vars.STAGE_CLUSTER_PROJECT }}
      CLUSTER_NAME: ${{ vars.STAGE_CLUSTER_NAME }}
      HELM_VALUES_PATH: ./helm-values/stage.yaml
      IMAGE: ${{ needs.build.outputs.image }}
      TYPE: ${{ matrix.type }}
      DEPLOYMENT_TOOL: ${{ matrix.deployment_tool }}
    secrets:
      PAT: ${{ secrets.STAGE_PAT }}
      GAR_KEY: ${{ secrets.STAGE_GAR_KEY }}

  prod_deployment:
    needs: [ build ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: ${{ vars.STAGE_APP_NAME }}
            namespace: ${{ vars.STAGE_NAMESPACE }}
            type: "deployment"
            deployment_tool: "helm" #deployment tool to use for deploying the application either helm or kubectl
    uses: zopsmart/zs-workflows/.github/workflows/prod_deploy.yaml@main
    with:
      APP_NAME: ${{ matrix.app_name }}
      IMAGE_REGISTRY: us-central1-docker.pkg.dev
      GAR_PROJECT: ${{ vars.PROD_GAR_PROJECT }}
      GAR_REGISTRY: ${{ vars.PROD_GAR_REGISTRY }}
      CLUSTER_PROJECT: ${{ vars.PROD_CLUSTER_PROJECT }}
      CLUSTER_NAME: ${{ vars.PROD_CLUSTER_NAME }}
      NAMESPACE: ${{ matrix.namespace }}
      HELM_VALUES_PATH: ./helm-values/prod.yaml
      IMAGE: ${{ needs.build.outputs.image }}
      TYPE: ${{ matrix.type }}
      DEPLOYMENT_TOOL: ${{ matrix.deployment_tool }}
    secrets:
      PAT: ${{ secrets.PROD_PAT }}
      GAR_KEY: ${{ secrets.PROD_GAR_KEY }}
