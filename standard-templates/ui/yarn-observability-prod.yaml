name: Build and Deploy
'on':
  pull_request:
    types:
      - review_requested
  push:
    tags:
      - '*'
    branches:
      - main

jobs:
  build:
    if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    uses: zopsmart/zs-workflows/.github/workflows/ui_yarn_build.yaml@v0.1.3
    with:
      APP_NAME: rlog-api
      NODE_VERSION: '18.x'
      BUILD_COMMAND: |
        yarn build
        tar -zcf rlog-api.zip dist
      ARTIFACT_PATH: |
        rlog-api.zip
        node_modules.zip
      ENABLE_TESTS: false
    secrets:
      PAT: '${{ secrets.PAT }}'
      NPM_TOKEN: '${{ secrets.PRIVATE_GITHUB_PACKAGE_PAT }}'
  stage_deployment:
    needs:
      - build
    if: (github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - DOCKER_FILE_PATH: .
            app_name: ${{ vars.RLOG_API_STAGE_APP_NAME }}
            namespace: ${{ vars.RLOG_API_STAGE_NAMESPACE }}
    uses: zopsmart/zs-workflows/.github/workflows/ui_gar_stage_deploy.yaml@v0.1.3
    with:
      DOCKER_FILE_PATH: '${{ matrix.DOCKER_FILE_PATH }}'
      APP_NAME: '${{ matrix.app_name }}'
      NAMESPACE: '${{ matrix.namespace }}'
      IMAGE_REGISTRY: us-central1-docker.pkg.dev
      GAR_PROJECT: ${{ vars.RLOG_API_STAGE_GAR_PROJECT }}
      GAR_REGISTRY: ${{ vars.RLOG_API_STAGE_GAR_REGISTRY }}
      CLUSTER_PROJECT: ${{ vars.RLOG_API_STAGE_CLUSTER_PROJECT }}
      CLUSTER_NAME: ${{ vars.RLOG_API_STAGE_CLUSTER_NAME }}
      HELM_VALUES_PATH: ./helm-values/stage-values.yaml
      SHA: '${{ needs.build.outputs.SHA }}'
      BUILD_ARGUMENTS: |
        NPM_TOKEN=${{ secrets.PRIVATE_GITHUB_PACKAGE_PAT }}
      UNZIP_COMMAND: |
        tar -xf rlog-api.zip
        tar -xf node_modules.zip
    secrets:
      PAT: ${{ secrets.RLOG_API_STAGE_PAT }}
      GAR_KEY: ${{ secrets.RLOG_API_STAGE_DEPLOY_KEY }}
      NPM_TOKEN: ${{ secrets.PRIVATE_GITHUB_PACKAGE_PAT }}
  prod_deployment:
    if: "startsWith(github.ref, 'refs/tags/v')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: ${{ vars.RLOG_API_PROD_APP_NAME }}
            namespace: ${{ vars.RLOG_API_PROD_NAMESPACE }}
    uses: zopsmart/zs-workflows/.github/workflows/go_gar_prod_deploy.yaml@v0.1.3
    with:
      APP_NAME: '${{ matrix.app_name }}'
      IMAGE_REGISTRY: us-central1-docker.pkg.dev
      GAR_PROJECT: ${{ vars.RLOG_API_PROD_GAR_PROJECT }}
      GAR_REGISTRY: ${{ vars.RLOG_API_PROD_GAR_REGISTRY }}
      CLUSTER_NAME: ${{ vars.RLOG_API_PROD_CLUSTER_NAME }}
      CLUSTER_PROJECT: ${{ vars.RLOG_API_PROD_CLUSTER_PROJECT }}
      NAMESPACE: '${{ matrix.namespace }}'
      HELM_VALUES_PATH: ./helm-values/prod-values.yaml
    secrets:
      PAT: ${{ secrets.RLOG_API_PROD_PAT }}
      GAR_KEY: ${{ secrets.RLOG_API_PROD_DEPLOY_KEY }}