name: Build and Deploy
'on':
  pull_request:
    types:
      - review_requested
  push:
    tags:
      - '*'
    branches:
      - main
jobs:
  build:
    if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    uses: zopsmart/app-template/.github/workflows/ui_yarn_build.yaml@ui-reusable
    with:
      APP_NAME: smart-quiz-admin-ui
      NODE_VERSION: '16.x'
      BUILD_COMMAND: |
        yarn build
        tar -zcf rlog-web.zip build
      ARTIFACT_PATH: |
        rlog-web.zip
        node_modules.zip
      LINTER_CHECKS: true
    secrets:
      PAT: '${{ secrets.GITHUB_TOKEN }}'
  stage_deployment:
    needs:
      - build
    if: (github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - DOCKER_FILE_PATH: Dockerfile
            app_name: rlog-web
            namespace: rlog
    uses: zopsmart/app-template/.github/workflows/ui_gar_stage_deploy.yaml@ui-reusable
    with:
      DOCKER_FILE_PATH: '${{ matrix.DOCKER_FILE_PATH }}'
      APP_NAME: '${{ matrix.app_name }}'
      NAMESPACE: '${{ matrix.namespace }}'
      IMAGE_REGISTRY: us-central1-docker.pkg.dev
      username: _json_key
      GAR_PROJECT: ${{ vars.STAGE_GAR_PROJECT }}
      GAR_REGISTRY: ${{ vars.STAGE_GAR_REGISTRY }}
      CLUSTER_PROJECT: ${{ vars.STAGE_CLUSTER_PROJECT }}
      CLUSTER_NAME: ${{ vars.STAGE_CLUSTER_NAME }}
      HELM_VALUES_PATH: ./helm-values/stage.yaml
      SHA: '${{ needs.build.outputs.SHA }}'
      UNZIP_COMMAND: |
        tar -xf rlog-web.zip
        tar -xf node_modules.zip
    secrets:
      PAT: ${{ secrets.STAGE_PAT }}
      GAR_KEY: ${{ secrets.STAGE_DEPLOY_KEY }}
  prod_deployment:
    if: "startsWith(github.ref, 'refs/tags/v')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - DOCKER_FILE_PATH: Dockerfile
            app_name: rlog-web
            namespace: rlog
    uses: zopsmart/app-template/.github/workflows/go_gar_prod_deploy.yaml@ui-reusable
    with:
      APP_NAME: '${{ matrix.app_name }}'
      IMAGE_REGISTRY: gcr.io
      username: _json_key
      GAR_PROJECT: ${{ vars.PROD_GAR_PROJECT }}
      GAR_REGISTRY: ${{ vars.PROD_GAR_REGISTRY }}
      CLUSTER_NAME: products-cluster
      CLUSTER_PROJECT: zs-products
      NAMESPACE: '${{ matrix.namespace }}'
      HELM_VALUES_PATH: ./helm-values/stage.yaml
    secrets:
      PAT: ${{ secrets.PROD_PAT }}
      GAR_KEY: ${{ secrets.PROD_DEPLOY_KEY }}