name: Build and Deploy

on:
  pull_request:
    types: [review_requested]
  push:
    tags:
      - '*'
    branches:
      - main
env:

  APP_NAME: app-name


jobs:
  test:
    if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    uses: zopsmart/app-template/.github/workflows/go_build.yaml@main
    with:
      TESTCOVERAGE_THRESHOLD: 90
      APP_NAME: $APP_NAME
      POSTMAN_ENABLED: false
    secrets:
      PAT: ${{secrets.PAT}}

  stage_deployment:
    needs: [ test ]
    if: (github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_commands: "<build command>"
            artifact_path: "based on build"
            DOCKER_FILE_PATH: "."
            app_name: "app-name"
            namespace: "namespace-name"
            type: "deployment"
          - build_commands: "<build commadn>"
            artifact_path: "based on build"
            DOCKER_FILE_PATH: "./cron/"
            app_name: "cron-name"
            namespace: "namespace-name"
            type: "cron"
    uses: zopsmart/app-template/.github/workflows/go_gcr_stage_deploy.yaml@main

    with:
      BUILD_COMMAND: ${{ matrix.build_commands }}
      ARTIFACT_PATH: ${{ matrix.artifact_path }}
      DOCKER_FILE_PATH: ${{ matrix.DOCKER_FILE_PATH }}
      APP_NAME: ${{ matrix.app_name }}
      NAMESPACE: ${{ matrix.namespace }}
      registry: gcr.io
      username: _json_key
      GCR_PROJECT: zs-products
      CLUSTER_NAME: products-cluster
      CLUSTER_PROJECT: zs-products
      SHA: ${{ needs.test.outputs.SHA }}
      TYPE: ${{ matrix.type }}


    secrets:
      GCR_KEY: ${{ secrets.GCR_JSON_KEY }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      PAT: ${{ secrets.PAT }}

  prod_deployment:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: "app-name"
            namespace: "namespace-name"
            type: "deployment"
          - app_name: "cron-name"
            namespace: "namespace-name"
            type: "cron"
    uses: zopsmart/app-template/.github/workflows/go_gcr_prod_deploy.yaml@main
    with:
      registry: gcr.io
      username: _json_key
      GCR_PROJECT: zs-products
      APP_NAME: ${{ matrix.app_name }}
      CLUSTER_NAME: products-cluster
      NAMESPACE: ${{ matrix.namespace }}
      CLUSTER_PROJECT: zs-products
      TYPE: ${{ matrix.type }}

    secrets:
      GCR_KEY: ${{ secrets.GCR_JSON_KEY }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      PAT: ${{ secrets.PAT }}