# Example: Go service with Google Artifact Registry (GAR) + Google Kubernetes Engine (GKE)
#
# This example pushes images to GAR and deploys to a GKE cluster.
# All configuration is via repository variables - minimal workflow inputs needed.
#
# Auto-detection:
#   - REGISTRY_TYPE: auto-detected as 'gar' from IMAGE_REGISTRY URL (*-docker.pkg.dev)
#   - Cluster auth: auto-detected as 'gke' from GCP Service Account JSON (type: service_account)
#
# Required repository variables (vars.*):
#   IMAGE_REGISTRY: "us-docker.pkg.dev"       # or region-docker.pkg.dev
#   REGISTRY_PROJECT: "my-gcp-project"        # GCP project ID
#   REGISTRY_REPO: "docker-registry"          # GAR repository name
#   CLUSTER_PROJECT: "my-gcp-project"         # GCP project for GKE cluster
#   CLUSTER_NAME: "my-cluster"                # GKE cluster name
#   CLUSTER_REGION: "us-central1"             # GKE cluster region
#   APP_NAME: "my-service"
#
# Required repository secrets (secrets.*):
#   REGISTRY_CREDENTIALS: GCP Service Account JSON with Artifact Registry Writer role
#   CLUSTER_CREDENTIALS: GCP Service Account JSON with GKE access (can be same as above)
#     Format: {"type": "service_account", "project_id": "...", "private_key": "...", ...}
#   PAT: GitHub Personal Access Token (optional, for private dependencies)

name: Deploy

on:
  push:
    branches: [development]
  release:
    types: [published]

jobs:
  stage:
    if: github.ref == 'refs/heads/development'
    uses: zopsmart/zs-workflows/.github/workflows/stage-deploy.yaml@main
    with:
      SVC_NAME: my-service
      BUILD_COMMAND: 'go build -o main ./cmd/...'
      # All other config from vars.* - no inputs needed
    secrets: inherit

  prod:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: zopsmart/zs-workflows/.github/workflows/prod-deploy.yaml@main
    with:
      SVC_NAME: my-service
    secrets: inherit
