# Example: Go service with GitHub Container Registry (GHCR) + kubeconfig auth
#
# Required repository variables (vars.*):
#   - REGISTRY_TYPE: "ghcr"
#   - REGISTRY_PROJECT: "my-org" (GitHub org or username)
#   - CLUSTER_NAME: "my-cluster"
#   - APP_NAME: "my-service"
#
# Required repository secrets (secrets.*):
#   - REGISTRY_CREDENTIALS: GitHub Personal Access Token with packages:write scope
#     (or use GITHUB_TOKEN if using same repo)
#   - CLUSTER_CREDENTIALS: Base64-encoded kubeconfig file
#     To encode: base64 -w 0 ~/.kube/config
#   - PAT: GitHub Personal Access Token (for private dependencies)

name: Deploy

on:
  push:
    branches: [development]
  release:
    types: [published]

jobs:
  stage:
    if: github.ref == 'refs/heads/development'
    uses: zopsmart/zs-workflows/.github/workflows/stage-deploy.yaml@main
    with:
      SVC_NAME: my-service
      BUILD_COMMAND: go build -o main ./cmd/...  # Language auto-detected as 'go'
      REGISTRY_TYPE: ghcr
      REGISTRY_PROJECT: my-org
    secrets: inherit

  prod:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: zopsmart/zs-workflows/.github/workflows/prod-deploy.yaml@main
    with:
      SVC_NAME: my-service
      REGISTRY_TYPE: ghcr
      REGISTRY_PROJECT: my-org
    secrets: inherit
