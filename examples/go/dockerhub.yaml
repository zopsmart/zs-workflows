# Example: Go service with Docker Hub + Kubeconfig deployment
#
# This example pushes images to Docker Hub and deploys to any Kubernetes cluster
# using a base64-encoded kubeconfig file. Cluster auth is auto-detected from
# the kubeconfig format in CLUSTER_CREDENTIALS.
#
# Required repository variables (vars.*):
#   APP_NAME: "my-service"
#
# Required repository secrets (secrets.*):
#   REGISTRY_CREDENTIALS: Docker Hub access token (username:token format or just token)
#   CLUSTER_CREDENTIALS: Base64-encoded kubeconfig file
#     Generate with: cat ~/.kube/config | base64 -w 0
#   PAT: GitHub Personal Access Token (optional, for private dependencies)
#
# Note: You can either specify REGISTRY_TYPE: dockerhub (IMAGE_REGISTRY defaults to docker.io)
# or specify IMAGE_REGISTRY: docker.io (REGISTRY_TYPE auto-detected as dockerhub).

name: Deploy

on:
  push:
    branches: [development]
  release:
    types: [published]

jobs:
  stage:
    if: github.ref == 'refs/heads/development'
    uses: zopsmart/zs-workflows/.github/workflows/stage-deploy.yaml@main
    with:
      SVC_NAME: my-service
      BUILD_COMMAND: 'go build -o main ./cmd/...'
      # Registry config
      REGISTRY_TYPE: dockerhub
      REGISTRY_PROJECT: myusername              # Docker Hub username/org
      # Cluster config (using kubeconfig - no cloud-specific inputs needed)
      # CLUSTER_CREDENTIALS secret contains base64 kubeconfig
    secrets: inherit

  prod:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: zopsmart/zs-workflows/.github/workflows/prod-deploy.yaml@main
    with:
      SVC_NAME: my-service
      REGISTRY_TYPE: dockerhub
      REGISTRY_PROJECT: myusername
    secrets: inherit
