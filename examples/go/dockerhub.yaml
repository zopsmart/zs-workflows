# Example: Go service with Docker Hub
#
# Required repository variables (vars.*):
#   - REGISTRY_TYPE: "dockerhub"
#   - REGISTRY_PROJECT: "myusername" (Docker Hub username or organization)
#   - CLUSTER_NAME: "my-cluster"
#   - APP_NAME: "my-service"
#
# Required repository secrets (secrets.*):
#   - REGISTRY_USERNAME: Docker Hub username
#   - REGISTRY_CREDENTIALS: Docker Hub access token or password
#   - CLUSTER_CREDENTIALS: Base64-encoded kubeconfig, or cloud-specific credentials
#   - PAT: GitHub Personal Access Token (for private dependencies)

name: Deploy

on:
  push:
    branches: [development]
  release:
    types: [published]

jobs:
  stage:
    if: github.ref == 'refs/heads/development'
    uses: zopsmart/zs-workflows/.github/workflows/stage-deploy.yaml@main
    with:
      SVC_NAME: my-service
      BUILD_COMMAND: go build -o main ./cmd/...  # Language auto-detected as 'go'
      REGISTRY_TYPE: dockerhub
      REGISTRY_PROJECT: myusername
    secrets: inherit

  prod:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: zopsmart/zs-workflows/.github/workflows/prod-deploy.yaml@main
    with:
      SVC_NAME: my-service
      REGISTRY_TYPE: dockerhub
      REGISTRY_PROJECT: myusername
    secrets: inherit
