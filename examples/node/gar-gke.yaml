# Example: Node/Yarn service with Google Artifact Registry (GAR) + Google Kubernetes Engine (GKE)
#
# Required repository variables (vars.*):
#   - REGISTRY_TYPE: "gar"
#   - IMAGE_REGISTRY: "us-docker.pkg.dev" (or your regional endpoint)
#   - REGISTRY_PROJECT: "my-gcp-project"
#   - REGISTRY_REPO: "docker-registry"
#   - CLUSTER_PROJECT: "my-gcp-project"
#   - CLUSTER_NAME: "my-cluster"
#   - CLUSTER_REGION: "us-central1"
#   - APP_NAME: "my-frontend"
#
# Required repository secrets (secrets.*):
#   - REGISTRY_CREDENTIALS: GCP Service Account JSON key (with Artifact Registry access)
#   - CLUSTER_CREDENTIALS: GCP Service Account JSON key (with GKE access, can be same as above)
#   - NPM_TOKEN: NPM token for private packages (optional)
#   - PAT: GitHub Personal Access Token (for private dependencies)

name: Deploy

on:
  push:
    branches: [development]
  release:
    types: [published]

jobs:
  stage:
    if: github.ref == 'refs/heads/development'
    uses: zopsmart/zs-workflows/.github/workflows/stage-deploy.yaml@main
    with:
      SVC_NAME: my-frontend
      BUILD_COMMAND: yarn build  # Language auto-detected as 'node'
      REACT_APP: true
    secrets: inherit

  prod:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: zopsmart/zs-workflows/.github/workflows/prod-deploy.yaml@main
    with:
      SVC_NAME: my-frontend
      REACT_APP: true
    secrets: inherit
