# Example: Node/Yarn service with Azure Container Registry (ACR) + Azure Kubernetes Service (AKS)
#
# This example pushes images to ACR and deploys to an AKS cluster.
#
# Auto-detection:
#   - REGISTRY_TYPE: auto-detected as 'acr' from IMAGE_REGISTRY URL (*.azurecr.io)
#   - Cluster auth: auto-detected as 'aks' from Azure JSON (clientSecret present)
#
# Required repository variables (vars.*):
#   APP_NAME: "my-frontend"
#
# Required repository secrets (secrets.*):
#   REGISTRY_CREDENTIALS: Azure Service Principal JSON for ACR access
#     Format: {"clientId": "...", "clientSecret": "...", "tenantId": "..."}
#   CLUSTER_CREDENTIALS: Azure Service Principal JSON for AKS access (can be same as above)
#     Format: {"clientId": "...", "clientSecret": "...", "tenantId": "..."}
#   NPM_TOKEN: NPM token for private packages (optional)
#   PAT: GitHub Personal Access Token (optional, for private dependencies)
#
# Note: CLUSTER_NAME and AZURE_RESOURCE_GROUP are required for AKS cluster authentication.

name: Deploy

on:
  push:
    branches: [development]
  release:
    types: [published]

jobs:
  stage:
    if: github.ref == 'refs/heads/development'
    uses: zopsmart/zs-workflows/.github/workflows/stage-deploy.yaml@main
    with:
      SVC_NAME: my-frontend
      BUILD_COMMAND: 'yarn build'
      REACT_APP: true                           # Generate React-style configmap
      # Registry: REGISTRY_TYPE auto-detected as 'acr' from URL
      IMAGE_REGISTRY: myregistry.azurecr.io
      # Cluster config
      CLUSTER_NAME: my-aks-cluster
      AZURE_RESOURCE_GROUP: my-resource-group
    secrets: inherit

  prod:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: zopsmart/zs-workflows/.github/workflows/prod-deploy.yaml@main
    with:
      SVC_NAME: my-frontend
      REACT_APP: true
      IMAGE_REGISTRY: myregistry.azurecr.io
      CLUSTER_NAME: my-aks-cluster
      AZURE_RESOURCE_GROUP: my-resource-group
    secrets: inherit
