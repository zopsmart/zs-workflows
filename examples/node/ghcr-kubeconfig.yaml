# Example: Node/Yarn service with GitHub Container Registry (GHCR) + kubeconfig auth
#
# This example pushes images to GHCR and deploys to any Kubernetes cluster
# using a base64-encoded kubeconfig file.
#
# Auto-detection:
#   - Cluster auth: auto-detected as 'kubeconfig' from base64-encoded kubeconfig format
#
# Required repository variables (vars.*):
#   APP_NAME: "my-frontend"
#
# Required repository secrets (secrets.*):
#   REGISTRY_CREDENTIALS: GitHub PAT with packages:write scope (or GITHUB_TOKEN for same repo)
#   CLUSTER_CREDENTIALS: Base64-encoded kubeconfig file
#     Generate with: cat ~/.kube/config | base64 -w 0
#   NPM_TOKEN: NPM token for private packages (optional)
#   PAT: GitHub Personal Access Token (optional, for private dependencies)
#
# Note: You can either specify REGISTRY_TYPE: ghcr (IMAGE_REGISTRY defaults to ghcr.io)
# or specify IMAGE_REGISTRY: ghcr.io (REGISTRY_TYPE auto-detected as ghcr).

name: Deploy

on:
  push:
    branches: [development]
  release:
    types: [published]

jobs:
  stage:
    if: github.ref == 'refs/heads/development'
    uses: zopsmart/zs-workflows/.github/workflows/stage-deploy.yaml@main
    with:
      SVC_NAME: my-frontend
      BUILD_COMMAND: 'yarn build'
      REACT_APP: true                           # Generate React-style configmap
      # Registry: GHCR only needs type (URL defaults to ghcr.io)
      REGISTRY_TYPE: ghcr
      REGISTRY_PROJECT: my-org                  # GitHub org or username
      # Cluster: kubeconfig auth (no cloud-specific inputs needed)
    secrets: inherit

  prod:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: zopsmart/zs-workflows/.github/workflows/prod-deploy.yaml@main
    with:
      SVC_NAME: my-frontend
      REACT_APP: true
      REGISTRY_TYPE: ghcr
      REGISTRY_PROJECT: my-org
    secrets: inherit
