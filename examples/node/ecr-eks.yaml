# Example: Node/Yarn service with Amazon ECR + Amazon EKS
#
# This example pushes images to ECR and deploys to an EKS cluster.
#
# Auto-detection:
#   - REGISTRY_TYPE: auto-detected as 'ecr' from IMAGE_REGISTRY URL (*.dkr.ecr.*.amazonaws.com)
#   - ECR region: auto-extracted from IMAGE_REGISTRY URL
#   - Cluster auth: auto-detected as 'eks' from AWS JSON (aws_secret_access_key present)
#
# Required repository variables (vars.*):
#   APP_NAME: "my-frontend"
#
# Required repository secrets (secrets.*):
#   REGISTRY_CREDENTIALS: AWS credentials JSON for ECR access
#     Format: {"aws_access_key_id": "AKIA...", "aws_secret_access_key": "..."}
#   CLUSTER_CREDENTIALS: AWS credentials JSON for EKS access (can be same as above)
#     Format: {"aws_access_key_id": "AKIA...", "aws_secret_access_key": "...", "aws_region": "us-east-1"}
#   NPM_TOKEN: NPM token for private packages (optional)
#   PAT: GitHub Personal Access Token (optional, for private dependencies)
#
# Note: CLUSTER_REGION is required for EKS cluster authentication.

name: Deploy

on:
  push:
    branches: [development]
  release:
    types: [published]

jobs:
  stage:
    if: github.ref == 'refs/heads/development'
    uses: zopsmart/zs-workflows/.github/workflows/stage-deploy.yaml@main
    with:
      SVC_NAME: my-frontend
      BUILD_COMMAND: 'yarn build'
      REACT_APP: true                           # Generate React-style configmap
      # Registry: REGISTRY_TYPE auto-detected as 'ecr' from URL
      IMAGE_REGISTRY: 123456789012.dkr.ecr.us-east-1.amazonaws.com
      # Cluster config
      CLUSTER_NAME: my-eks-cluster
      CLUSTER_REGION: us-east-1                 # Required for EKS cluster auth
    secrets: inherit

  prod:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: zopsmart/zs-workflows/.github/workflows/prod-deploy.yaml@main
    with:
      SVC_NAME: my-frontend
      REACT_APP: true
      IMAGE_REGISTRY: 123456789012.dkr.ecr.us-east-1.amazonaws.com
      CLUSTER_NAME: my-eks-cluster
      CLUSTER_REGION: us-east-1
    secrets: inherit
