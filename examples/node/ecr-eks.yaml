# Example: Node/Yarn service with Amazon ECR + Amazon EKS
#
# Required repository variables (vars.*):
#   - REGISTRY_TYPE: "ecr"
#   - IMAGE_REGISTRY: "123456789012.dkr.ecr.us-east-1.amazonaws.com"
#   - CLUSTER_NAME: "my-eks-cluster"
#   - AWS_REGION: "us-east-1"
#   - APP_NAME: "my-frontend"
#
# Required repository secrets (secrets.*):
#   - REGISTRY_CREDENTIALS: AWS credentials JSON
#     Example: {"aws_access_key_id": "AKIA...", "aws_secret_access_key": "..."}
#   - CLUSTER_CREDENTIALS: AWS credentials JSON (can be same as REGISTRY_CREDENTIALS)
#     Example: {"aws_access_key_id": "AKIA...", "aws_secret_access_key": "..."}
#   - NPM_TOKEN: NPM token for private packages (optional)
#   - PAT: GitHub Personal Access Token (for private dependencies)

name: Deploy

on:
  push:
    branches: [development]
  release:
    types: [published]

jobs:
  stage:
    if: github.ref == 'refs/heads/development'
    uses: zopsmart/zs-workflows/.github/workflows/stage-deploy.yaml@main
    with:
      SVC_NAME: my-frontend
      BUILD_COMMAND: yarn build  # Language auto-detected as 'node'
      REACT_APP: true
      REGISTRY_TYPE: ecr
      IMAGE_REGISTRY: 123456789012.dkr.ecr.us-east-1.amazonaws.com
      CLUSTER_NAME: my-eks-cluster
      AWS_REGION: us-east-1
    secrets: inherit

  prod:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: zopsmart/zs-workflows/.github/workflows/prod-deploy.yaml@main
    with:
      SVC_NAME: my-frontend
      REACT_APP: true
      REGISTRY_TYPE: ecr
      IMAGE_REGISTRY: 123456789012.dkr.ecr.us-east-1.amazonaws.com
      CLUSTER_NAME: my-eks-cluster
      AWS_REGION: us-east-1
    secrets: inherit
