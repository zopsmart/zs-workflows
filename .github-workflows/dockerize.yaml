name: dockerize sample-api

on:
  push:
    branches:
      - "main"
      - "development"
      - "workflow"

env:
  app_name: '<app_name>'
  GOPRIVATE: developer.zopsmart.com/go/gofr
  project_name: '<project_name>'
  namespace: '<namespace>'

jobs:
  dockerize:
    runs-on: ubuntu-latest
    name: Dockerize
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Download Artifacts
        uses: actions/download-artifact@v2
        with:
          name: artifacts

      - name: change permission
        run: chmod a+x main

      - name: Login to GCR
        uses: docker/login-action@v1
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCR_KEY }}

      - name: Build and Push Docker Image to GCR
        uses: docker/build-push-action@v2
        with:
          push: true
          context: .
          file: ./Dockerfile
          tags: gcr.io/${{ env.project_name }}/${{ env.app_name }}:${{ github.sha }}
