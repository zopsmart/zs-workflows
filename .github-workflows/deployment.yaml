name: Deploy sample-api

on:
  push:
    branches:
      - "main"
      - "development"
      - "workflow"

env:
  app_name: '<app_name>'
  GOPRIVATE: developer.zopsmart.com/go/gofr
  namespace: '<namespace>'


jobs:
  deployment:
    runs-on: ubuntu-latest
    needs: dockerize
    name: Deploy
    env:
      image: ${{needs.dockerize.outputs.image}}

    if: github.ref == 'refs/heads/workflow' && (github.event_name == 'push')
    steps:

      - name: Checkout Code
        uses: actions/checkout@v2

#      - name: Add image env property with commit sha tag
#        run: echo "image=`echo gcr.io/${{ env.project_name }}/${{ env.app_name }}:${{ github.sha }}`" >> $GITHUB_ENV

      - name: Install Helm
        uses: azure/setup-helm@v3
        id: install

      - name: Setup Helm Chart
        run: git clone https://${{ secrets.PAT }}@github.com/zopsmart/helm.git

      - name: Verify
        run: ls -la
      - name: Directory
        run: pwd

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: zopsmart-poc
          service_account_key: ${{ secrets.DEPLOY_KEY }}
          export_default_credentials: true

      - name: Update Kubectl component
        run: gcloud --quiet components update kubectl

      - name: Set GCloud Project and Fetch Cluster Credentials
        run: gcloud container clusters get-credentials headless-services-dev  --region=us-east4 --project=zopsmart-poc

      - name: Update Deployment Image
        run: helm upgrade --install --set image=${{ env.image }} ${{ env.app_name }} ./helm/service/ -f ./gcp-values.yaml -n ${{ env.namespace }}
