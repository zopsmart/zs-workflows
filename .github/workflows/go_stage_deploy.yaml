name: "Stage Deployment and Update-configmap"
on:
  workflow_call:
    inputs:
      APP_NAME:
        description: 'name of postman collection file'
        required: true
        type: string
      EXTRA_DEPENDENCIES:
        description: 'enable step to install extra dependencies'
        required: false
        type: boolean
        default: false
      DEPENDENCIES_COMMAND:
        description: 'commands to install extra dependencies'
        required: false
        type: string
      TYPE:
        type: string
        description: "deployment or cron"
        required: true
      ARTIFACT_PATH:
        description: "path used for build with respect to main.go file"
        required: true
        type: string
      GO_VERSION:
        description: 'go version'
        required: false
        type: string
        default: '1.20'
      SHA:
        type: string
        required: true
      CLUSTER_PROJECT:
        type: string
        required: true
      CLUSTER_NAME:
        type: string
        required: false
        default: ''
      CLUSTER_REGION:
        type: string
        required: true
      NAMESPACE:
        type: string
        required: true
      IMAGE_REGISTRY:
        type: string
        required: true
      GAR_PROJECT:
        type: string
        required: true
      GAR_REGISTRY:
        type: string
        required: true
      DOCKER_FILE_PATH:
        description: 'path of docker file'
        required: true
        type: string
      BUILD_COMMAND:
        description: 'go build command'
        required: true
        type: string
      BUILD_ARGUMENTS:
        description: 'build arguments for DockerFile'
        required: false
        type: string

    secrets:
      PAT:
        description: 'pat for helm'
        required: false
      GAR_KEY:
        description: 'gar key'
        required: true
jobs:
  build_dockerize:
    runs-on: ubuntu-latest
    name: 🔨 Build and 🐳 Dockerize
    if: (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main') && (!startsWith(github.ref, 'refs/tags/v'))
    outputs:
      image: ${{ steps.output-image.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '${{ inputs.GO_VERSION }}'

      - name: Get dependencies
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
        run: |
          git config --global url."https://${{ secrets.PAT }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          git config --global http.sslVerify false
          go mod download

      - name: Extra dependencies
        if: ${{ inputs.EXTRA_DEPENDENCIES }}
        run: |
          ${{ inputs.DEPENDENCIES_COMMAND }}

      - name: Make Directory
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
        run: mkdir build

      - name: Build
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
        run: |
          directory=$(pwd)
          cd ${{ inputs.DOCKER_FILE_PATH }}
          ls
          pwd
          ${{ inputs.BUILD_COMMAND }}
          if [ "${{ inputs.DOCKER_FILE_PATH }}" != "." ]; then
            mv ${{ inputs.ARTIFACT_PATH }} $directory
          fi

      - name: Login to GAR
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.IMAGE_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GAR_KEY }}

      - name: Push Docker Image to GAR
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
        uses: docker/build-push-action@v2
        with:
          push: true
          context: .
          file: ${{ inputs.DOCKER_FILE_PATH }}/Dockerfile
          tags: ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ inputs.SHA }}
          build-args: |
            ${{ inputs.BUILD_ARGUMENTS }}

      - id: output-image
        if: (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main') && (github.event_name == 'push')
        run: echo "image=`echo ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ inputs.SHA }}`" >> "$GITHUB_OUTPUT"

  stage_deployment:
    runs-on: ubuntu-latest
    needs: [ build_dockerize ]
    if: ${{ inputs.CLUSTER_NAME != '' && (github.ref == 'refs/heads/development') }}
    container:
      image: ghcr.io/zopsmart/gha-images:deployments-0.1.4
      options: --rm
    name: 🚀 Stage Deployment and Update Configmap
    env:
      image: ${{ needs.build_dockerize.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authorize to GCP service account
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GAR_KEY }}

      - name: Set GCloud Project and Fetch Cluster Credentials
        run: gcloud container clusters get-credentials ${{ inputs.CLUSTER_NAME }} --region=${{ inputs.CLUSTER_REGION }} --project=${{ inputs.CLUSTER_PROJECT }}

      - name: Update Deployment Image using Kubectl
        if: ${{ inputs.TYPE == 'deployment' }}
        run: kubectl set image deployment/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ env.image }} --namespace ${{ inputs.NAMESPACE }}

      - name: Update Cron Image
        if: ${{ inputs.TYPE == 'cron' }}
        run: kubectl set image cronjobs/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ env.image }} --namespace ${{ inputs.NAMESPACE }}