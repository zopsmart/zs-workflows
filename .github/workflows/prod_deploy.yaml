name: "Prod Deployment and Update-configmap"
on:
  workflow_call:
    inputs:
      APP_NAME:
        description: 'name of postman collection file'
        required: true
        type: string
      TYPE:
        type: string
        description: "deployment or cron"
        required: true
      DEPLOYMENT_TOOL:
        type: string
        description: "kubectl or helm"
        required: true
      IMAGE_REGISTRY:
        type: string
        required: true
      GAR_PROJECT:
        type: string
        required: true
      GAR_REGISTRY:
        type: string
        required: true
      CLUSTER_PROJECT:
        type: string
        required: true
      CLUSTER_NAME:
        type: string
        required: true
      NAMESPACE:
        type: string
        required: true
      HELM_VALUES_PATH:
        type: string
        required: false
      ENV_FILE_PATH:
        description: 'env file path'
        required: false
        type: string
        default: "./configs/.prod.env"
      REACT_APP:
        description: 'for react service'
        type: boolean
        required: false
        default: false
    secrets:
      PAT:
        description: 'pat for helm'
        required: false
      GAR_KEY:
        description: 'gar key'
        required: true
jobs:
  prod_deployment:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v')}}
    container:
      image: ghcr.io/zopsmart/gha-images:deployments-0.1.4
      options: --rm
    name: 🚀 Prod Deployment and Update Configmap
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authorize to GCP service account
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GAR_KEY }}

      - name: Add Helm Repo
        if: ${{ inputs.DEPLOYMENT_TOOL == 'helm' }}
        run: |
          helm repo add helm \
            --username "${{ github.actor }}" \
            --password "${{ secrets.PAT }}" \
            "https://raw.githubusercontent.com/zopsmart/helm/v0.2.3/charts"

      - name: Check if image tag exists
        if: ${{ startsWith(github.ref, 'refs/tags/v')}}
        id: tag-check
        run: |
          if gcloud artifacts docker images list ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }} --include-tags | grep -q "${{ github.sha }}"; then
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
              echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Release Tag
        if: ${{ steps.tag-check.outputs.tag_exists == 'true' }}
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Set up Docker CLI
        if: ${{ steps.tag-check.outputs.tag_exists == 'true' }}
        uses: docker/login-action@v1
        with:
          registry: ${{ inputs.IMAGE_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GAR_KEY }}

      - name: Change tag and push image
        id: prod-image
        if: ${{ steps.tag-check.outputs.tag_exists == 'true' }}
        run: |
          docker pull ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ github.sha }}
          docker tag ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ github.sha }}  ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ env.RELEASE_VERSION }}
          docker push ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ env.RELEASE_VERSION }}
          echo "image=${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ env.RELEASE_VERSION }}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Set GCloud Project and Fetch Cluster Credentials
        if: ${{ steps.tag-check.outputs.tag_exists == 'true' }}
        run: gcloud container clusters get-credentials ${{ inputs.CLUSTER_NAME }} --region=us-central1 --project=${{ inputs.CLUSTER_PROJECT }}

      - name: Update Deployment Image using Helm
        if: ${{ inputs.DEPLOYMENT_TOOL == 'helm' && inputs.TYPE == 'deployment' && steps.tag-check.outputs.tag_exists == 'true' }}
        run: helm upgrade --install --set image=${{ steps.prod-image.outputs.image }} ${{ inputs.APP_NAME }} helm/service -f ${{ inputs.HELM_VALUES_PATH }} -n ${{ inputs.NAMESPACE }} --version v0.1.9

      - name: Update Deployment Image using Kubectl
        if: ${{ inputs.DEPLOYMENT_TOOL == 'kubectl' && inputs.TYPE == 'deployment' && steps.tag-check.outputs.tag_exists == 'true' }}
        run: kubectl set image deployment/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ steps.prod-image.outputs.image }} --namespace ${{ inputs.NAMESPACE }}

      - name: Update Cron Image
        if: ${{ inputs.DEPLOYMENT_TOOL == 'kubectl' && inputs.TYPE == 'cron' && steps.tag-check.outputs.tag_exists == 'true' }}
        run: kubectl set image cronjobs/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ steps.prod-image.outputs.image }} --namespace ${{ inputs.NAMESPACE }}

      - name: Set App Version
        if: ${{ inputs.TYPE == 'deployment' && steps.tag-check.outputs.tag_exists == 'true' }}
        run: kubectl set env deployment/${{ inputs.APP_NAME }} APP_VERSION=${{ env.RELEASE_VERSION }} -n ${{ inputs.NAMESPACE }}

      - name: Read ENV Files
        if: ${{ steps.tag-check.outputs.tag_exists == 'true' }}
        run: |
          CONFIG_MAP_NAME=${{ inputs.APP_NAME }}
          ENV_FILE_PATH=${{ inputs.ENV_FILE_PATH }}

          # Create an associative array to store key-value pairs
          declare -A envArray

          # Read each line in .env and extract key-value pairs
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [ -z "$line" ] || [ "${line:0:1}" == "#" ]; then
              continue
            fi
            key=$(echo "$line" | cut -d '=' -f 1)
            value=$(echo "$line" | cut -d '=' -f 2-)
            envArray["$key"]=$value
          done < "$ENV_FILE_PATH"

          # Handle the case when the last line doesn't end with a newline character
          if [[ -n "$line" ]]; then
            key=$(echo "$line" | cut -d '=' -f 1)
            value=$(echo "$line" | cut -d '=' -f 2-)
            envArray["$key"]=$value
          fi
          react="${{ inputs.REACT_APP }}"

          # Read the .env file and create a ConfigMap YAML dynamically
          echo "apiVersion: v1" > $CONFIG_MAP_NAME.yaml
          echo "kind: ConfigMap" >> $CONFIG_MAP_NAME.yaml
          echo "metadata:" >> $CONFIG_MAP_NAME.yaml
          echo "  name: $CONFIG_MAP_NAME" >> $CONFIG_MAP_NAME.yaml
          echo "data:" >> $CONFIG_MAP_NAME.yaml
          if [[ $react == "true" ]]; then
            echo "  environment.js: |" >> $CONFIG_MAP_NAME.yaml
            echo "    if (typeof window !== 'undefined')" >> $CONFIG_MAP_NAME.yaml
            echo "    window.env = {" >> $CONFIG_MAP_NAME.yaml
            for key in "${!envArray[@]}"; do
              echo "      $key: "${envArray[$key]}"," >> $CONFIG_MAP_NAME.yaml
            done
            echo "    }" >> $CONFIG_MAP_NAME.yaml
          else
            for key in "${!envArray[@]}"; do
              echo "  $key: ${envArray[$key]}" >> $CONFIG_MAP_NAME.yaml
            done
          fi
        shell: bash

      - name: Update configmap
        if: ${{ steps.tag-check.outputs.tag_exists == 'true' }}
        run: kubectl apply --force -f ${{ inputs.APP_NAME }}.yaml -n ${{ inputs.NAMESPACE }}