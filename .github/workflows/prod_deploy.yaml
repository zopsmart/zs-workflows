name: "Prod Deployment and Update-configmap"
on:
  workflow_call:
    inputs:
      APP_NAME:
        description: 'name of postman collection file'
        required: true
        type: string
      TYPE:
        type: string
        description: "deployment or cron"
        required: true
      IMAGE_REGISTRY:
        type: string
        required: true
      GAR_PROJECT:
        type: string
        required: true
      GAR_REGISTRY:
        type: string
        required: true
      CLUSTER_PROJECT:
        type: string
        required: true
      CLUSTER_NAME:
        type: string
        required: true
      CLUSTER_REGION:
        type: string
        required: true
      NAMESPACE:
        type: string
        required: true
    secrets:
      GAR_KEY:
        description: 'gar key'
        required: true
jobs:
  prod_deployment:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v')}}
    container:
      image: ghcr.io/zopsmart/gha-images:deployments-0.1.4
      options: --rm
    name: 🚀 Prod Deployment and Update Configmap
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authorize to GCP service account
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GAR_KEY }}

      - name: Check if image tag exists
        if: ${{ startsWith(github.ref, 'refs/tags/v')}}
        id: tag-check
        run: |
          if gcloud artifacts docker images list ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }} --include-tags | grep -q "${{ github.sha }}"; then
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
              echo "tag_exists=false" >> "$GITHUB_OUTPUT"
              echo "Image does not exist with the tag ${{ github.sha }}"
          fi

      - name: Extract Release Tag
        if: ${{ steps.tag-check.outputs.tag_exists == 'true' }}
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Set up Docker CLI
        if: ${{ steps.tag-check.outputs.tag_exists == 'true' }}
        uses: docker/login-action@v1
        with:
          registry: ${{ inputs.IMAGE_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GAR_KEY }}

      - name: Change tag and push image
        id: prod-image
        if: ${{ steps.tag-check.outputs.tag_exists == 'true' }}
        run: |
          docker pull ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ github.sha }}
          docker tag ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ github.sha }}  ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ env.RELEASE_VERSION }}
          docker push ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ env.RELEASE_VERSION }}
          echo "image=${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ env.RELEASE_VERSION }}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Set GCloud Project and Fetch Cluster Credentials
        if: ${{ steps.tag-check.outputs.tag_exists == 'true' }}
        run: gcloud container clusters get-credentials ${{ inputs.CLUSTER_NAME }} --region=${{ inputs.CLUSTER_REGION }} --project=${{ inputs.CLUSTER_PROJECT }}

      - name: Update Deployment Image using Kubectl
        if: ${{ inputs.TYPE == 'deployment' && steps.tag-check.outputs.tag_exists == 'true' }}
        run: kubectl set image deployment/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ steps.prod-image.outputs.image }} --namespace ${{ inputs.NAMESPACE }}

      - name: Update Cron Image
        if: ${{ inputs.TYPE == 'cron' && steps.tag-check.outputs.tag_exists == 'true' }}
        run: kubectl set image cronjobs/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ steps.prod-image.outputs.image }} --namespace ${{ inputs.NAMESPACE }}

      - name: Set App Version
        if: ${{ inputs.TYPE == 'deployment' && steps.tag-check.outputs.tag_exists == 'true' }}
        run: kubectl set env deployment/${{ inputs.APP_NAME }} APP_VERSION=${{ env.RELEASE_VERSION }} -n ${{ inputs.NAMESPACE }}