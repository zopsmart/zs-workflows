name: "test and linters"
on:
  workflow_call:
    inputs:
      IMAGE_REGISTRY:
        type: string
        required: true
      username:
        type: string
        required: true
      GCR_PROJECT:
        description: 'required input'
        required: true
        type: string
      APP_NAME:
        type: string
        required: true
      SHA:
        type: string
        required: true
      CLUSTER_NAME:
        description: 'required input'
        required: true
        type: string
      CLUSTER_PROJECT:
        description: 'required input'
        required: true
        type: string
      DOCKER_FILE_PATH:
        description: 'path of docker file'
        required: true
        type: string
      NAMESPACE:
        description: 'required input'
        required: true
        type: string
      TYPE:
        required: true
        type: string
      UNZIP_COMMAND:
         required: true
         type: string
      BUILD_ARGUMENTS:
        description: 'build arguments for DockerFile'
        required: false
        type: string
      ENV_FILE_PATH:
        description: 'env file path'
        required: false
        type: string
        default: "./configs/.stage.env"

    secrets:
      GCR_KEY:
        description: 'required input'
        required: true
      DEPLOY_KEY:
        description: 'required input'
        required: true

jobs:
  dockerize_stage:
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
    outputs:
      image: ${{ steps.output-image.outputs.image }}
    name: 🐳 Dockerize Stage    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GCR
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.IMAGE_REGISTRY }}
          username: ${{ inputs.username }}
          password: ${{ secrets.GCR_KEY }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.APP_NAME }}

      - name: Unzipping artifacts
        id: tag
        run: |
          ${{ inputs.UNZIP_COMMAND }}

      - name: Build and Push Image Stage
        uses: docker/build-push-action@v4
        with:
          push: true
          context: .
          file: ${{ inputs.DOCKER_FILE_PATH }}
          tags: gcr.io/${{ inputs.GCR_PROJECT }}/${{ inputs.APP_NAME }}:${{ inputs.SHA }}
          build-args: |
            ${{ inputs.BUILD_ARGUMENTS }}

      - id: output-image
        run: echo "image=`echo gcr.io/${{ inputs.GCR_PROJECT }}/${{ inputs.APP_NAME }}:${{ inputs.SHA }}`" >> "$GITHUB_OUTPUT"

  update_configmap:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development')
    uses: zopsmart/zs-workflows/.github/workflows/update-configmap.yaml@main
    with:
      APP_NAME: ${{ inputs.APP_NAME }}
      ENV_FILE_PATH: ${{ inputs.ENV_FILE_PATH }}
      CLUSTER_PROJECT: ${{ inputs.CLUSTER_PROJECT }}
      CLUSTER_NAME: ${{ inputs.CLUSTER_NAME }}
      NAMESPACE: ${{ inputs.NAMESPACE }}
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

  stage_deployment:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to Stage
    if: (github.ref == 'refs/heads/development')
    needs: dockerize_stage
    container:
      image: ghcr.io/zopsmart/gha-images:deployments-0.1.3
      options: --rm
    env:
      image: ${{needs.dockerize_stage.outputs.image}}

    steps:
      - name: Authorize to GCP service account
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.DEPLOY_KEY }}

      - name: Set GCloud Project and Fetch Cluster Credentials
        run:
          gcloud container clusters get-credentials ${{ inputs.CLUSTER_NAME }} --zone=us-central1 --project=${{ inputs.CLUSTER_PROJECT }}

      - name: Update Deployment Image
        if: ${{ inputs.TYPE == 'deployment' }}
        run: kubectl set image deployment/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ env.image }} --namespace ${{ inputs.NAMESPACE }}

      - name: Update Cron Image
        if: ${{ inputs.TYPE == 'cron' }}
        run: kubectl set image cronjobs/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ env.image }} --namespace ${{ inputs.NAMESPACE }}