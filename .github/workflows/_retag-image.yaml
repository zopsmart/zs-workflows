name: "Retag Image"

on:
  workflow_call:
    inputs:
      SVC_NAME:
        description: 'Service name (image name)'
        required: true
        type: string
      REGISTRY_TYPE:
        description: 'Registry provider: gar, gcr, ecr, acr, dockerhub, ghcr, custom'
        required: true
        type: string
      IMAGE_REGISTRY:
        description: 'Registry URL (auto-set for gcr/dockerhub/ghcr, required for others)'
        required: false
        type: string
        default: ''
      REGISTRY_PROJECT:
        description: 'Project/account/namespace within registry'
        required: false
        type: string
        default: ''
      REGISTRY_REPO:
        description: 'Repository name within project'
        required: false
        type: string
        default: ''
      SOURCE_TAG:
        description: 'Source image tag (usually git SHA)'
        required: true
        type: string
      TARGET_TAG:
        description: 'Target image tag (usually release version)'
        required: true
        type: string

    outputs:
      image:
        description: 'Full image URL with new tag'
        value: ${{ jobs.retag.outputs.image }}
      tag_exists:
        description: 'Whether the source image tag exists'
        value: ${{ jobs.retag.outputs.tag_exists }}

    secrets:
      REGISTRY_CREDENTIALS:
        description: 'Registry auth credentials (auto-detected: GCP SA JSON, AWS JSON, Azure JSON, or password/token)'
        required: false

jobs:
  retag:
    runs-on: ubuntu-latest
    name: Retag Image
    outputs:
      image: ${{ steps.retag.outputs.image }}
      tag_exists: ${{ steps.check-tag.outputs.tag_exists }}

    steps:
      - name: Resolve registry defaults
        id: registry
        run: |
          REGISTRY_TYPE="${{ inputs.REGISTRY_TYPE }}"
          IMAGE_REGISTRY="${{ inputs.IMAGE_REGISTRY }}"

          # Set default IMAGE_REGISTRY based on type
          if [[ -z "$IMAGE_REGISTRY" ]]; then
            case "$REGISTRY_TYPE" in
              gcr) IMAGE_REGISTRY="gcr.io" ;;
              ghcr) IMAGE_REGISTRY="ghcr.io" ;;
              dockerhub) IMAGE_REGISTRY="docker.io" ;;
            esac
          fi

          echo "image_registry=$IMAGE_REGISTRY" >> "$GITHUB_OUTPUT"

          # Build image path based on what components are provided
          REGISTRY_PROJECT="${{ inputs.REGISTRY_PROJECT }}"
          REGISTRY_REPO="${{ inputs.REGISTRY_REPO }}"
          SVC_NAME="${{ inputs.SVC_NAME }}"

          # Construct base image path (without tag): REGISTRY/PROJECT/REPO/SVC or REGISTRY/PROJECT/SVC or REGISTRY/SVC
          if [[ -n "$REGISTRY_PROJECT" && -n "$REGISTRY_REPO" ]]; then
            IMAGE_BASE="${IMAGE_REGISTRY}/${REGISTRY_PROJECT}/${REGISTRY_REPO}/${SVC_NAME}"
          elif [[ -n "$REGISTRY_PROJECT" ]]; then
            IMAGE_BASE="${IMAGE_REGISTRY}/${REGISTRY_PROJECT}/${SVC_NAME}"
          else
            IMAGE_BASE="${IMAGE_REGISTRY}/${SVC_NAME}"
          fi

          echo "image_base=$IMAGE_BASE" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Parse registry credentials
        id: creds
        run: |
          CREDS='${{ secrets.REGISTRY_CREDENTIALS }}'
          REGISTRY_TYPE="${{ inputs.REGISTRY_TYPE }}"

          # Detect credential type and extract values
          if [[ "$REGISTRY_TYPE" == "ecr" ]]; then
            if echo "$CREDS" | jq -e '.aws_access_key_id' > /dev/null 2>&1; then
              echo "aws_access_key_id=$(echo "$CREDS" | jq -r '.aws_access_key_id')" >> "$GITHUB_OUTPUT"
              echo "aws_secret_access_key=$(echo "$CREDS" | jq -r '.aws_secret_access_key')" >> "$GITHUB_OUTPUT"
              echo "aws_region=$(echo "$CREDS" | jq -r '.aws_region // "us-east-1"')" >> "$GITHUB_OUTPUT"
            else
              echo "ERROR: For ECR, REGISTRY_CREDENTIALS must be JSON with aws_access_key_id and aws_secret_access_key"
              exit 1
            fi
          elif [[ "$REGISTRY_TYPE" == "acr" ]]; then
            if echo "$CREDS" | jq -e '.clientId' > /dev/null 2>&1; then
              echo "azure_client_id=$(echo "$CREDS" | jq -r '.clientId')" >> "$GITHUB_OUTPUT"
              echo "azure_client_secret=$(echo "$CREDS" | jq -r '.clientSecret')" >> "$GITHUB_OUTPUT"
              echo "azure_tenant_id=$(echo "$CREDS" | jq -r '.tenantId')" >> "$GITHUB_OUTPUT"
            else
              echo "ERROR: For ACR, REGISTRY_CREDENTIALS must be JSON with clientId, clientSecret, and tenantId"
              exit 1
            fi
          fi
        shell: bash

      # Login to GAR/GCR
      - name: Login to GAR/GCR
        if: inputs.REGISTRY_TYPE == 'gar' || inputs.REGISTRY_TYPE == 'gcr'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.image_registry }}
          username: _json_key
          password: ${{ secrets.REGISTRY_CREDENTIALS }}

      # Login to ECR
      - name: Configure AWS credentials
        if: inputs.REGISTRY_TYPE == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ steps.creds.outputs.aws_access_key_id }}
          aws-secret-access-key: ${{ steps.creds.outputs.aws_secret_access_key }}
          aws-region: ${{ steps.creds.outputs.aws_region }}

      - name: Login to ECR
        if: inputs.REGISTRY_TYPE == 'ecr'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.image_registry }}

      # Login to ACR
      - name: Login to ACR
        if: inputs.REGISTRY_TYPE == 'acr'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.image_registry }}
          username: ${{ steps.creds.outputs.azure_client_id }}
          password: ${{ steps.creds.outputs.azure_client_secret }}

      # Login to Docker Hub
      - name: Login to Docker Hub
        if: inputs.REGISTRY_TYPE == 'dockerhub'
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_CREDENTIALS }}

      # Login to GHCR
      - name: Login to GHCR
        if: inputs.REGISTRY_TYPE == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_CREDENTIALS || github.token }}

      # Login to custom registry
      - name: Login to custom registry
        if: inputs.REGISTRY_TYPE == 'custom'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.image_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_CREDENTIALS }}

      - name: Check if source image tag exists
        id: check-tag
        run: |
          SOURCE_IMAGE="${{ steps.registry.outputs.image_base }}:${{ inputs.SOURCE_TAG }}"

          echo "Checking if image exists: $SOURCE_IMAGE"

          # Use docker manifest inspect - works with any registry
          if docker manifest inspect "$SOURCE_IMAGE" > /dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Source image found with tag: ${{ inputs.SOURCE_TAG }}"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "ERROR: Source image does not exist with tag: ${{ inputs.SOURCE_TAG }}"
          fi
        shell: bash

      - name: Retag and push image
        id: retag
        if: steps.check-tag.outputs.tag_exists == 'true'
        run: |
          SOURCE_IMAGE="${{ steps.registry.outputs.image_base }}:${{ inputs.SOURCE_TAG }}"
          TARGET_IMAGE="${{ steps.registry.outputs.image_base }}:${{ inputs.TARGET_TAG }}"

          echo "Pulling: $SOURCE_IMAGE"
          docker pull "$SOURCE_IMAGE"

          echo "Tagging as: $TARGET_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"

          echo "Pushing: $TARGET_IMAGE"
          docker push "$TARGET_IMAGE"

          echo "image=$TARGET_IMAGE" >> "$GITHUB_OUTPUT"
        continue-on-error: true
