name: "Test, Build, Dockerise and Update-configmap"
on:
  workflow_call:
    secrets:
      PAT:
        description: 'github token'
        required: true
      GAR_KEY:
        description: 'required input'
        required: true
      NPM_TOKEN:
        description: 'npm token'
        required: false
    inputs:
      APP_NAME:
        description: 'name of ui service'
        required: true
        type: string
      NODE_VERSION:
        description: 'node version'
        type: string
        required: true
      BUILD_COMMAND:
        description: 'node build command'
        required: true
        type: string
      TEST_COMMAND:
        description: 'command to run test files'
        required: false
        type: string
      BRANCH_NAME:
        description: 'name of branch main/master'
        required: false
        type: string
        default: main
      DEPENDENCIES_FLAG:
        required: false
        type: string
        default: ""
      LINTER_CHECKS:
        required: false
        type: boolean
        default: true
      ENABLE_TESTS:
        required: false
        type: boolean
        default: true
      PRETTIER_CHECKS:
        required: false
        type: boolean
        default: true
      DOCKER_FILE_PATH:
        description: 'path of docker file'
        required: true
        type: string
      IMAGE_REGISTRY:
        type: string
        required: true
      GAR_PROJECT:
        type: string
        required: true
      GAR_REGISTRY:
        type: string
        required: true
      CLUSTER_PROJECT:
        type: string
        required: true
      CLUSTER_NAME:
        type: string
        required: true
      STAGE_NAMESPACE:
        type: string
        required: true
      PROD_NAMESPACE:
        type: string
        required: true
      STAGE_ENV_FILE_PATH:
        description: 'env file path'
        required: false
        type: string
        default: "./configs/.stage.env"
      PROD_ENV_FILE_PATH:
        description: 'env file path'
        required: false
        type: string
        default: "./configs/.stage.env"
      REACT_APP:
        description: 'for react service'
        type: boolean
        required: false
        default: false


    outputs:
      SHA:
        description: "commit sha for image"
        value: ${{ jobs.build.outputs.sha }}

env:
  event_flag: ${{ github.event_name == 'push' }}
  branch_flag: ${{ github.ref == 'refs/heads/${{ inputs.BRANCH_NAME }}' }}
jobs:
  update_configmap:
    if: ${{ (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && !startsWith(github.ref, 'refs/tags/v') }}
    uses: zopsmart/zs-workflows/.github/workflows/update-configmap.yaml@main
    with:
      APP_NAME: ${{ inputs.APP_NAME }}
      STAGE_ENV_FILE_PATH: ${{ inputs.STAGE_ENV_FILE_PATH }}
      PROD_ENV_FILE_PATH: ${{ inputs.PROD_ENV_FILE_PATH }}
      CLUSTER_PROJECT: ${{ inputs.CLUSTER_PROJECT }}
      CLUSTER_NAME: ${{ inputs.CLUSTER_NAME }}
      STAGE_NAMESPACE: ${{ inputs.STAGE_NAMESPACE }}
      PROD_NAMESPACE: ${{ inputs.PROD_NAMESPACE }}
      REACT_APP: ${{ inputs.REACT_APP }}
    secrets:
      GAR_KEY: ${{ secrets.GAR_KEY }}

  test:
    runs-on: ubuntu-latest
    if: ${{ (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main'  || github.ref == 'refs/heads/master' || github.event_name == 'pull_request') && !startsWith(github.ref, 'refs/tags/v') }}
    name: 🧪 Test, 🔨 Build and 🐳 Dockerize
    outputs:
      image: ${{ steps.output-image.outputs.image }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.NODE_VERSION }}

      - name: installing dependencies and zipping node modules
        run: |
          echo "@zopsmart:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.PAT }}" >> ~/.npmrc
          npm install ${{ inputs.DEPENDENCIES_FLAG }}
          tar -zcf node_modules.zip node_modules/

      - name: run linter
        if: ${{ inputs.LINTER_CHECKS }}
        run: |
          CI=false npm run lint

      - name: run prettier
        if: ${{ inputs.PRETTIER_CHECKS }}
        run: |
          CI=false npm run prettier:check

      - name: run tests
        if: ${{ inputs.ENABLE_TESTS }}
        run: |
          ${{ inputs.TEST_COMMAND }}

      - name: Generate Coverage Badges
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && inputs.ENABLE_TESTS }}
        run: |
          CI=false npm run make-badges

      - name: Commit Badge changes
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && inputs.ENABLE_TESTS }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git diff --quiet --exit-code README.md || git commit -a -m "Update badges in README.md file"


      - name: Push Coverage Badge
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && inputs.ENABLE_TESTS }}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT}}
          branch: ${{github.ref}}

      - name: Generating build
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
        run: |
          ${{ inputs.BUILD_COMMAND }}

      - name: Login to GAR
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.IMAGE_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GAR_KEY }}

      - name: Push Docker Image to GAR
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
        uses: docker/build-push-action@v2
        with:
          push: true
          context: .
          file: ${{ inputs.DOCKER_FILE_PATH }}
          tags: ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ github.sha }}
          build-args: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
            ${{ inputs.BUILD_ARGUMENTS }}

      - id: output-image
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
        run: echo "image=`echo  ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ github.sha }}`" >> "$GITHUB_OUTPUT"