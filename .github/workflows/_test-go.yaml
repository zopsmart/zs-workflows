name: Test Go

on:
  workflow_call:
    inputs:
      TESTCOVERAGE_THRESHOLD:
        description: 'Minimum test coverage percentage required'
        required: true
        type: string
      POSTMAN_ENABLED:
        description: 'Enable Postman collection tests'
        required: false
        type: boolean
        default: false
      APP_NAME:
        description: 'Name of postman collection file'
        required: false
        type: string
        default: ''
      GO_VERSION:
        description: 'Go version to use'
        required: false
        type: string
        default: '1.20'
      ADD_SCHEMA:
        description: 'Enable step to load DB schema'
        required: false
        type: boolean
        default: false
      SCHEMA_COMMAND:
        description: 'Command to load DB schema'
        required: false
        type: string
      EXTRA_DEPENDENCIES:
        description: 'Enable step to install extra dependencies'
        required: false
        type: boolean
        default: false
      DEPENDENCIES_COMMAND:
        description: 'Commands to install extra dependencies'
        required: false
        type: string
      SERVER_COMMAND:
        description: 'Commands to setup before running server for postman'
        required: false
        type: string
        default: ""
      MYSQL_ENABLE:
        description: 'Enable MySQL service container'
        required: false
        type: boolean
        default: false
      POSTGRES_ENABLE:
        description: 'Enable PostgreSQL service container'
        required: false
        type: boolean
        default: false
      REDIS_ENABLE:
        description: 'Enable Redis service container'
        required: false
        type: boolean
        default: false
      ZIPKIN_ENABLE:
        description: 'Enable Zipkin service container'
        required: false
        type: boolean
        default: false
      ELASTIC_SEARCH_ENABLE:
        description: 'Enable Elasticsearch service container'
        required: false
        type: boolean
        default: false
      KAFKA_ENABLE:
        description: 'Enable Kafka service container'
        required: false
        type: boolean
        default: false
      MONGO_ENABLE:
        description: 'Enable MongoDB service container'
        required: false
        type: boolean
        default: false
      MSSQL_ENABLE:
        description: 'Enable MSSQL service container'
        required: false
        type: boolean
        default: false
      DYNAMODB_ENABLE:
        description: 'Enable DynamoDB service container'
        required: false
        type: boolean
        default: false
      CASSANDRA_ENABLE:
        description: 'Enable Cassandra service container'
        required: false
        type: boolean
        default: false
      MODULES:
        description: 'List of modules to run test cases'
        required: false
        type: string

    secrets:
      PAT:
        description: 'GitHub Personal Access Token for private dependencies'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test and Linters
    # No branch restriction - runs whenever called by consumer workflow
    services:
      mysql:
        image: ${{ inputs.MYSQL_ENABLE && 'mysql:8.0.30' || '' }}
        ports:
          - "3306:3306"
        env:
          MYSQL_DATABASE: "test"
          MYSQL_ROOT_PASSWORD: "password"
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      postgres:
        image: ${{ inputs.POSTGRES_ENABLE && 'postgres:15.1' || '' }}
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
          POSTGRES_DB: test

      redis:
        image: ${{ inputs.REDIS_ENABLE && 'redis:5.0.14' || '' }}
        ports:
          - "6379:6379"
        options: "--entrypoint redis-server"

      zipkin:
        image: ${{ inputs.ZIPKIN_ENABLE && 'openzipkin/zipkin' || '' }}
        ports:
          - "9411:9411"

      elasticsearch:
        image: ${{ inputs.ELASTIC_SEARCH_ENABLE && 'elasticsearch:6.8.6' || '' }}
        ports:
          - 2012:9200
          - 2013:9300
          - 9200:9200
        env:
          discovery type: "single-node"

      kafka:
        image: ${{ inputs.KAFKA_ENABLE && 'krisgeus/docker-kafka' || '' }}
        ports:
          - 2008:2008
          - 2009:2009
        env:
          ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:2008,INTERNAL://localhost:2009'
          LISTENERS: 'PLAINTEXT://0.0.0.0:2008,INTERNAL://0.0.0.0:2009'
          SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT'
          INTER_BROKER: 'INTERNAL'
          KAFKA_CREATE_TOPICS: 'test-topic'
          KAFKA_HOSTS: 'localhost:2008,localhost:2009'
          KAFKA_TOPIC: 'test-topic'

      mongo:
        image: ${{ inputs.MONGO_ENABLE && 'mongo:6.0.2' || '' }}
        ports:
          - "27017:27017"
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123

      mssql:
        image: ${{ inputs.MSSQL_ENABLE && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        ports:
          - "1433:1433"
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: reallyStrongPwd123

      dynamodb:
        image: ${{ inputs.DYNAMODB_ENABLE && 'amazon/dynamodb-local' || '' }}
        ports:
          - "2021:8000"

      cassandra:
        image: ${{ inputs.CASSANDRA_ENABLE && 'cassandra:4.0.6' || '' }}
        ports:
          - 9041:9042
        options: --health-cmd "cqlsh --debug"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '${{ inputs.GO_VERSION }}'

      - name: Add DB Schema
        if: ${{ inputs.ADD_SCHEMA }}
        run: |
          ${{ inputs.SCHEMA_COMMAND }}

      - name: Get dependencies
        run: |
          git config --global url."https://${{ secrets.PAT }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          git config --global http.sslVerify false
          go mod download
          go install go.shabbyrobe.org/gocovmerge/cmd/gocovmerge@latest
          go install github.com/AlexBeauchemin/gobadge@latest

      - name: Extra dependencies
        if: ${{ inputs.EXTRA_DEPENDENCIES }}
        run: |
          ${{ inputs.DEPENDENCIES_COMMAND }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v1.54.2
          args: --timeout 8m
          skip-pkg-cache: true
          skip-build-cache: true

      - name: Test
        run: |
          mkdir -p temp/build
          GOFR_ENV=test go test ./... -count=1 -v -coverprofile temp/cover1.out -coverpkg=./...
          modules="${{ inputs.MODULES }}"
          modules=$(echo "$modules" | xargs)
          modules=$(echo "$modules" | tr -d '\r')
          echo "$modules"
          counter=2
          for module in $modules; do
            echo "Processing module: $module"
            cd $module
            GOFR_ENV=test go test ./... -count=1 -v -coverprofile ../temp/cover${counter}.out -coverpkg=./...
            cd ..
            counter=$((counter + 1))
          done
          coverfiles=$(ls temp/cover*.out)
          gocovmerge $coverfiles > temp/cover.out
          cat temp/cover.out | grep -v "mock_interface" | grep -v "migrations" > temp/coverage.out

      - name: Test Coverage report
        run: |
          go tool cover -func=temp/coverage.out | tee temp/c.out

      - name: Coverage Quality Gate
        run: |
          echo "Quality Gate: checking test coverage is above threshold ..."
          echo "Threshold             : ${{ inputs.TESTCOVERAGE_THRESHOLD }}%"
          totalCoverage=`go tool cover -func=temp/coverage.out | grep 'total:' | grep -Eo '[0-9]+\.[0-9]+'`
          echo "Current test coverage : $totalCoverage %"
          totalInt=${totalCoverage%.*}
          if [ "$totalInt" -ge "${{ inputs.TESTCOVERAGE_THRESHOLD }}" ]; then
              echo "OK"
          else
              echo "Current test coverage is below threshold. Please add more unit tests or adjust threshold to a lower value."
              echo "Failed"
              exit 1
          fi

      - name: Run Server
        if: ${{ inputs.POSTMAN_ENABLED }}
        run: |
          if [ "${{ inputs.SERVER_COMMAND }}" != "" ]; then
            echo "Running commands"
            ${{ inputs.SERVER_COMMAND }}
          else
            echo "Starting server"
          fi
          GOFR_ENV=test go run main.go &
          sleep 30

      - name: Install newman and Run Postman Collection
        if: ${{ inputs.POSTMAN_ENABLED }}
        run: |
          ${{ inputs.SERVER_COMMAND }}
          npm install -g newman
          newman run postman-collections/${{ inputs.APP_NAME }}.postman-collection.json

      - name: Stop Server
        if: ${{ inputs.POSTMAN_ENABLED }}
        run: pkill main
