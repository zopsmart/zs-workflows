name: Build and Deploy Rlog-web

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

env:
  app_name: ${{ vars.APP_NAME }}
  gar_project_name: ${{ vars.GAR_PROJECT }}
  namespace: ${{ vars.NAMESPACE }}
  cluster_name: ${{ vars.CLUSTER_NAME }}
  cluster_project_name: ${{ vars.CLUSTER_PROJECT }}
  registry_name: ${{ vars.GAR_REGISTRY }}

jobs:
  build:
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/development' && github.event_name == 'push')
    steps:
      - name: Set Node.js 16.x
        uses: actions/setup-node@v3
        with:
          node-version: 16.x

      - name: Checkout code into node module directory
        uses: actions/checkout@v2

      - name: Fetch dependencies
        run: |
          git config --global url."https://${{ secrets.PAT }}:x-oauth-basic@github.com/zopsmart".insteadOf "https://github.com/zopsmart"
          git config --global http.sslVerify false
          yarn install

      - name: Make Directory
        run: mkdir build

      - name: Build
        run: |
          yarn build

      - name: Test
        run: |
          yarn test

      - name: Linter Check
        run: |
          yarn lint

  dockerize:
    runs-on: ubuntu-latest
    name: Dockerize
    needs: build

    outputs:
      image: ${{ steps.output-image.outputs.image }}

    if: github.ref == 'refs/heads/development' && (github.event_name == 'push')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: create env file
        run: |
          touch .env
          echo "NEXT_PUBLIC_BACKEND_BASE_URL=$RLOG_BACKEND_BASE_URL" >> .env
          echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env
          echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env
          echo "GOOGLE_CLIENT_ID=${{fromJSON(secrets.OAUTH_KEY).web.client_id}}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{fromJSON(secrets.OAUTH_KEY).web.client_secret}}" >> .env
          echo "NEXT_PUBLIC_REACT_APP_VERSION=$NEXT_PUBLIC_REACT_APP_VERSION" >> .env
          echo "NEXT_PUBLIC_REACT_APP_RLOG_API_KEY=$NEXT_PUBLIC_REACT_APP_RLOG_API_KEY" >> .env

      - name: Login to GAR
        uses: docker/login-action@v2
        with:
          registry: us-east4-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.DEPLOY_KEY }}

      - name: Build and Push Docker Image to GCR
        uses: docker/build-push-action@v2
        with:
          push: true
          context: .
          file: ./Dockerfile
          tags: us-east4-docker.pkg.dev/${{ env.gar_project_name }}/${{ env.registry_name }}/${{ env.app_name}}:${{ github.sha }}
      - id: output-image
        run: echo "image=`echo us-east4-docker.pkg.dev/${{ env.gar_project_name }}/${{ env.registry_name }}/${{ env.app_name}}:${{ github.sha }}`" >> "$GITHUB_OUTPUT"

  deployment:
    runs-on: ubuntu-latest
    needs: dockerize
    name: Deploy
    env:
      image: ${{needs.dockerize.outputs.image}}

    if: github.ref == 'refs/heads/namespace-test' && (github.event_name == 'push')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Install Helm
        uses: azure/setup-helm@v3
        id: install

      - name: Setup Helm Chart
        run: git clone https://${{ secrets.PAT }}@github.com/zopsmart/helm.git

      - name: Verify
        run: ls -la
      - name: Directory
        run: pwd

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: ${{ env.cluster_project_name }}
          service_account_key: ${{ secrets.DEPLOY_KEY }}
          export_default_credentials: true

      - name: Update Kubectl component
        run: gcloud --quiet components update kubectl

      - name: Set GCloud Project and Fetch Cluster Credentials
        run: gcloud container clusters get-credentials ${{ env.cluster_name }}  --region=us-east4 --project=${{ env.cluster_project_name }}

      - name: Update Deployment Image
        run: helm upgrade --install --set image=${{ env.image }} ${{ env.app_name }} ./helm/service/ -f ./values.yaml -n ${{ env.namespace }}