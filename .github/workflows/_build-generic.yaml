name: "Build Generic"

on:
  workflow_call:
    inputs:
      SVC_NAME:
        description: 'Service name'
        required: true
        type: string
      BUILD_COMMAND:
        description: 'Build command'
        required: true
        type: string
      DOCKER_FILE_PATH:
        description: 'Path to Dockerfile directory'
        required: false
        type: string
        default: '.'
      BUILD_ARGUMENTS:
        description: 'Docker build arguments'
        required: false
        type: string
        default: ''
      REGISTRY_TYPE:
        description: 'Registry provider: gar, gcr, ecr, acr, dockerhub, ghcr, custom'
        required: true
        type: string
      IMAGE_REGISTRY:
        description: 'Registry URL (auto-set for gcr/dockerhub/ghcr, required for others)'
        required: false
        type: string
        default: ''
      REGISTRY_PROJECT:
        description: 'Project/account/namespace within registry'
        required: false
        type: string
        default: ''
      REGISTRY_REPO:
        description: 'Repository name within project'
        required: false
        type: string
        default: ''
      REGISTRY_USERNAME:
        description: 'Username for Docker Hub/GHCR/custom registry (defaults to github.actor)'
        required: false
        type: string
        default: ''
      # ECR-specific
      AWS_ACCESS_KEY_ID:
        description: 'AWS access key ID (for ECR, fallback if not in JSON credentials)'
        required: false
        type: string
        default: ''
      AWS_REGION:
        description: 'AWS region (for ECR)'
        required: false
        type: string
        default: 'us-east-1'
      # ACR-specific
      AZURE_CLIENT_ID:
        description: 'Azure client ID (for ACR, fallback if not in JSON credentials)'
        required: false
        type: string
        default: ''
      AZURE_TENANT_ID:
        description: 'Azure tenant ID (for ACR, fallback if not in JSON credentials)'
        required: false
        type: string
        default: ''
      IMAGE_TAG:
        description: 'Image tag (usually git SHA)'
        required: true
        type: string

    outputs:
      image:
        description: 'Full image URL with tag'
        value: ${{ jobs.build.outputs.image }}

    secrets:
      REGISTRY_CREDENTIALS:
        description: 'Registry auth credentials (auto-detected: GCP SA JSON, AWS JSON, Azure JSON, or password/token)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Dockerize (Generic)
    outputs:
      image: ${{ steps.docker.outputs.image }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Log warning about skipped dependency setup
        run: |
          echo "::warning::Language could not be detected from BUILD_COMMAND. Skipping language-specific dependency setup (go mod download, yarn install, etc.)."
          echo "If your build fails, please specify LANGUAGE explicitly (go or node)."

      - name: Build
        run: |
          cd ${{ inputs.DOCKER_FILE_PATH }}
          ${{ inputs.BUILD_COMMAND }}

      - name: Docker build and push
        uses: ./.github/actions/docker-build-push
        id: docker
        with:
          registry_type: ${{ inputs.REGISTRY_TYPE }}
          image_registry: ${{ inputs.IMAGE_REGISTRY }}
          registry_project: ${{ inputs.REGISTRY_PROJECT }}
          registry_repo: ${{ inputs.REGISTRY_REPO }}
          svc_name: ${{ inputs.SVC_NAME }}
          image_tag: ${{ inputs.IMAGE_TAG }}
          dockerfile_path: ${{ inputs.DOCKER_FILE_PATH }}
          build_arguments: ${{ inputs.BUILD_ARGUMENTS }}
          registry_credentials: ${{ secrets.REGISTRY_CREDENTIALS }}
          registry_username: ${{ inputs.REGISTRY_USERNAME }}
          aws_access_key_id: ${{ inputs.AWS_ACCESS_KEY_ID }}
          aws_region: ${{ inputs.AWS_REGION }}
          azure_client_id: ${{ inputs.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ inputs.AZURE_TENANT_ID }}
          github_actor: ${{ github.actor }}
          github_token: ${{ github.token }}
