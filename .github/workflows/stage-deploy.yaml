name: "Stage Deploy"

on:
  workflow_call:
    inputs:
      # Required inputs
      SVC_NAME:
        description: 'Service name (k8s deployment/cronjob name)'
        required: true
        type: string
      BUILD_COMMAND:
        description: 'Build command (e.g., go build -o main ./cmd/... or yarn build)'
        required: true
        type: string
      LANGUAGE:
        description: 'Build type: go or node (auto-detected from BUILD_COMMAND if not specified)'
        required: false
        type: string
        default: ''

      # Optional inputs with defaults
      TYPE:
        description: 'deployment or cron'
        required: false
        type: string
        default: 'deployment'
      DOCKER_FILE_PATH:
        description: 'Path to Dockerfile directory'
        required: false
        type: string
        default: '.'
      DEPLOY_METHOD:
        description: 'kubectl or helm'
        required: false
        type: string
        default: 'kubectl'
      HELM_VALUES_PATH:
        description: 'Path to Helm values file (required if DEPLOY_METHOD=helm)'
        required: false
        type: string
        default: ''
      ENV_FILE_PATH:
        description: 'Path to env file. Empty string skips configmap. Default: configs/.stage.env'
        required: false
        type: string
        default: '__default__'
      BUILD_ARGUMENTS:
        description: 'Docker build arguments'
        required: false
        type: string
        default: ''
      REACT_APP:
        description: 'Enable React-specific configmap format'
        required: false
        type: boolean
        default: false

      # Go-specific inputs
      GO_VERSION:
        description: 'Go version (for LANGUAGE=go)'
        required: false
        type: string
        default: '1.20'
      ARTIFACT_PATH:
        description: 'Path to built artifact (for LANGUAGE=go)'
        required: false
        type: string
        default: 'main'
      EXTRA_DEPENDENCIES:
        description: 'Enable extra dependencies step (for LANGUAGE=go)'
        required: false
        type: boolean
        default: false
      DEPENDENCIES_COMMAND:
        description: 'Commands to install extra dependencies (for LANGUAGE=go)'
        required: false
        type: string
        default: ''

      # Node-specific inputs
      NODE_VERSION:
        description: 'Node version (for LANGUAGE=node)'
        required: false
        type: string
        default: '18'
      DEPENDENCIES_FLAG:
        description: 'Additional flags for yarn install (for LANGUAGE=node)'
        required: false
        type: string
        default: ''

      # Registry inputs (provider-agnostic)
      REGISTRY_TYPE:
        description: 'Registry provider: gar, gcr, ecr, acr, dockerhub, ghcr, custom. Auto-detected from IMAGE_REGISTRY if not provided'
        required: false
        type: string
        default: ''
      IMAGE_REGISTRY:
        description: 'Container registry URL. REGISTRY_TYPE is auto-detected from URL pattern. Required for gar/ecr/acr/custom'
        required: false
        type: string
        default: ''
      REGISTRY_PROJECT:
        description: 'Project/account/namespace within registry. Used for image path construction. Falls back to vars.REGISTRY_PROJECT'
        required: false
        type: string
        default: ''
      REGISTRY_REPO:
        description: 'Repository name within project. Used for image path construction. Falls back to vars.REGISTRY_REPO or vars.APP_NAME'
        required: false
        type: string
        default: ''

      # Cluster auth inputs (multi-cloud)
      CLUSTER_PROJECT:
        description: 'GCP project for cluster. Required for GKE auth. Falls back to vars.CLUSTER_PROJECT'
        required: false
        type: string
        default: ''
      CLUSTER_NAME:
        description: 'Kubernetes cluster name. Required for GKE/EKS/AKS auth. Falls back to vars.CLUSTER_NAME'
        required: false
        type: string
        default: ''
      CLUSTER_REGION:
        description: 'Cluster region. Required for GKE/EKS auth. Falls back to vars.CLUSTER_REGION, then vars.AWS_REGION (default: us-central1)'
        required: false
        type: string
        default: ''
      AZURE_RESOURCE_GROUP:
        description: 'Azure resource group. Required for AKS auth. Falls back to vars.AZURE_RESOURCE_GROUP'
        required: false
        type: string
        default: ''
      NAMESPACE:
        description: 'Kubernetes namespace. Falls back to vars.STAGE_NAMESPACE or {APP_NAME}-stage'
        required: false
        type: string
        default: ''

    secrets:
      PAT:
        description: 'GitHub PAT for private dependencies'
        required: false
      NPM_TOKEN:
        description: 'NPM token for private packages (for LANGUAGE=node)'
        required: false
      REGISTRY_CREDENTIALS:
        description: 'Registry auth credentials (auto-detected: GCP SA JSON, AWS JSON, Azure JSON, or password/token)'
        required: false
      STAGE_CLUSTER_CREDENTIALS:
        description: 'Stage cluster auth credentials (auto-detected: GCP SA key, AWS JSON, Azure JSON, or base64 kubeconfig)'
        required: false
      CLUSTER_CREDENTIALS:
        description: 'Fallback cluster auth credentials (used if STAGE_CLUSTER_CREDENTIALS not provided)'
        required: false
      # Legacy support
      GAR_KEY:
        description: 'Deprecated: Use REGISTRY_CREDENTIALS instead'
        required: false
      STAGE_DEPLOY_KEY:
        description: 'Deprecated: Use CLUSTER_CREDENTIALS instead'
        required: false
      DEPLOY_KEY:
        description: 'Deprecated: Use CLUSTER_CREDENTIALS instead'
        required: false

jobs:
  # Resolve registry configuration
  resolve-registry:
    uses: ./.github/workflows/_resolve-registry-config.yaml
    with:
      REGISTRY_TYPE: ${{ inputs.REGISTRY_TYPE }}
      IMAGE_REGISTRY: ${{ inputs.IMAGE_REGISTRY }}
      REGISTRY_PROJECT: ${{ inputs.REGISTRY_PROJECT }}
      REGISTRY_REPO: ${{ inputs.REGISTRY_REPO }}

  # Resolve deploy configuration (cluster, namespace, env file)
  resolve-deploy:
    uses: ./.github/workflows/_resolve-deploy-config.yaml
    with:
      ENVIRONMENT: stage
      CLUSTER_PROJECT: ${{ inputs.CLUSTER_PROJECT }}
      CLUSTER_NAME: ${{ inputs.CLUSTER_NAME }}
      CLUSTER_REGION: ${{ inputs.CLUSTER_REGION }}
      AZURE_RESOURCE_GROUP: ${{ inputs.AZURE_RESOURCE_GROUP }}
      NAMESPACE: ${{ inputs.NAMESPACE }}
      ENV_FILE_PATH: ${{ inputs.ENV_FILE_PATH }}

  # Detect language from build command
  detect-language:
    runs-on: ubuntu-latest
    name: Detect Language
    outputs:
      language: ${{ steps.detect.outputs.language }}
    steps:
      - name: Detect language from BUILD_COMMAND
        id: detect
        run: |
          BUILD_CMD="${{ inputs.BUILD_COMMAND }}"
          INPUT_LANG="${{ inputs.LANGUAGE }}"

          # If LANGUAGE is explicitly provided, use it
          if [[ -n "$INPUT_LANG" ]]; then
            if [[ "$INPUT_LANG" != "go" && "$INPUT_LANG" != "node" ]]; then
              echo "ERROR: LANGUAGE must be 'go' or 'node', got '$INPUT_LANG'"
              exit 1
            fi
            echo "language=$INPUT_LANG" >> "$GITHUB_OUTPUT"
            echo "Using explicitly provided LANGUAGE: $INPUT_LANG"
            exit 0
          fi

          # Auto-detect from BUILD_COMMAND
          if echo "$BUILD_CMD" | grep -qE '\bgo\s+(build|run|test|install)\b'; then
            echo "language=go" >> "$GITHUB_OUTPUT"
            echo "Detected language: go (from BUILD_COMMAND containing 'go build/run/test/install')"
          elif echo "$BUILD_CMD" | grep -qE '\b(yarn|npm)\b'; then
            echo "language=node" >> "$GITHUB_OUTPUT"
            echo "Detected language: node (from BUILD_COMMAND containing 'yarn' or 'npm')"
          else
            echo "::warning::Unable to detect language from BUILD_COMMAND '$BUILD_CMD'. Skipping language-specific dependency setup."
            echo "language=generic" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  # Check what changed
  check-changes:
    needs: resolve-deploy
    if: github.ref == 'refs/heads/development'
    uses: zopsmart/zs-workflows/.github/workflows/_check-changes.yaml@main
    with:
      ENV_FILE_PATH: ${{ needs.resolve-deploy.outputs.env_file_path }}

  # Build
  build:
    needs: [resolve-registry, detect-language, check-changes]
    if: needs.check-changes.outputs.deployment == 'true'
    uses: zopsmart/zs-workflows/.github/workflows/_build.yaml@main
    with:
      LANGUAGE: ${{ needs.detect-language.outputs.language }}
      SVC_NAME: ${{ inputs.SVC_NAME }}
      BUILD_COMMAND: ${{ inputs.BUILD_COMMAND }}
      RUNTIME_VERSION: ${{ needs.detect-language.outputs.language == 'go' && inputs.GO_VERSION || inputs.NODE_VERSION }}
      DOCKER_FILE_PATH: ${{ inputs.DOCKER_FILE_PATH }}
      BUILD_ARGUMENTS: ${{ inputs.BUILD_ARGUMENTS }}
      REGISTRY_TYPE: ${{ needs.resolve-registry.outputs.registry_type }}
      IMAGE_REGISTRY: ${{ needs.resolve-registry.outputs.image_registry }}
      REGISTRY_PROJECT: ${{ needs.resolve-registry.outputs.registry_project }}
      REGISTRY_REPO: ${{ needs.resolve-registry.outputs.registry_repo }}
      IMAGE_TAG: ${{ github.sha }}
      # Go-specific
      ARTIFACT_PATH: ${{ inputs.ARTIFACT_PATH }}
      EXTRA_DEPENDENCIES: ${{ inputs.EXTRA_DEPENDENCIES }}
      DEPENDENCIES_COMMAND: ${{ inputs.DEPENDENCIES_COMMAND }}
      # Node-specific
      DEPENDENCIES_FLAG: ${{ inputs.DEPENDENCIES_FLAG }}
    secrets:
      PAT: ${{ secrets.PAT }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      REGISTRY_CREDENTIALS: ${{ secrets.REGISTRY_CREDENTIALS || secrets.GAR_KEY }}

  # Deploy to stage
  deploy:
    needs: [resolve-deploy, check-changes, build]
    if: |
      always() &&
      needs.check-changes.outputs.deployment == 'true' &&
      needs.build.result == 'success' &&
      needs.resolve-deploy.outputs.cluster_name != ''
    uses: zopsmart/zs-workflows/.github/workflows/_deploy.yaml@main
    with:
      SVC_NAME: ${{ inputs.SVC_NAME }}
      TYPE: ${{ inputs.TYPE }}
      IMAGE: ${{ needs.build.outputs.image }}
      NAMESPACE: ${{ needs.resolve-deploy.outputs.namespace }}
      ENVIRONMENT: stage
      CLUSTER_PROJECT: ${{ needs.resolve-deploy.outputs.cluster_project }}
      CLUSTER_NAME: ${{ needs.resolve-deploy.outputs.cluster_name }}
      CLUSTER_REGION: ${{ needs.resolve-deploy.outputs.cluster_region }}
      AZURE_RESOURCE_GROUP: ${{ needs.resolve-deploy.outputs.azure_resource_group }}
      DEPLOY_METHOD: ${{ inputs.DEPLOY_METHOD }}
      HELM_VALUES_PATH: ${{ inputs.HELM_VALUES_PATH }}
    secrets:
      CLUSTER_CREDENTIALS: ${{ secrets.STAGE_CLUSTER_CREDENTIALS || secrets.CLUSTER_CREDENTIALS || secrets.STAGE_DEPLOY_KEY || secrets.DEPLOY_KEY }}
      PAT: ${{ secrets.PAT }}

  # Update configmap after deployment
  update-configmap:
    needs: [resolve-deploy, check-changes, deploy]
    if: |
      always() &&
      needs.check-changes.outputs.deployment == 'true' &&
      needs.deploy.result == 'success' &&
      needs.resolve-deploy.outputs.env_file_path != '' &&
      needs.resolve-deploy.outputs.cluster_name != ''
    uses: zopsmart/zs-workflows/.github/workflows/_update-configmap.yaml@main
    with:
      SVC_NAME: ${{ inputs.SVC_NAME }}
      NAMESPACE: ${{ needs.resolve-deploy.outputs.namespace }}
      ENV_FILE_PATH: ${{ needs.resolve-deploy.outputs.env_file_path }}
      ENVIRONMENT: stage
      CLUSTER_PROJECT: ${{ needs.resolve-deploy.outputs.cluster_project }}
      CLUSTER_NAME: ${{ needs.resolve-deploy.outputs.cluster_name }}
      CLUSTER_REGION: ${{ needs.resolve-deploy.outputs.cluster_region }}
      AZURE_RESOURCE_GROUP: ${{ needs.resolve-deploy.outputs.azure_resource_group }}
      REACT_APP: ${{ inputs.REACT_APP }}
      ENV_FILE_PATH_EXPLICIT: ${{ needs.resolve-deploy.outputs.env_file_explicit == 'true' }}
    secrets:
      CLUSTER_CREDENTIALS: ${{ secrets.STAGE_CLUSTER_CREDENTIALS || secrets.CLUSTER_CREDENTIALS || secrets.STAGE_DEPLOY_KEY || secrets.DEPLOY_KEY }}

  # Update configmap only (when only env file changed)
  update-configmap-only:
    needs: [resolve-deploy, check-changes]
    if: |
      needs.check-changes.outputs.configmap == 'true' &&
      needs.check-changes.outputs.deployment != 'true' &&
      needs.resolve-deploy.outputs.env_file_path != '' &&
      needs.resolve-deploy.outputs.cluster_name != ''
    uses: zopsmart/zs-workflows/.github/workflows/_update-configmap.yaml@main
    with:
      SVC_NAME: ${{ inputs.SVC_NAME }}
      NAMESPACE: ${{ needs.resolve-deploy.outputs.namespace }}
      ENV_FILE_PATH: ${{ needs.resolve-deploy.outputs.env_file_path }}
      ENVIRONMENT: stage
      CLUSTER_PROJECT: ${{ needs.resolve-deploy.outputs.cluster_project }}
      CLUSTER_NAME: ${{ needs.resolve-deploy.outputs.cluster_name }}
      CLUSTER_REGION: ${{ needs.resolve-deploy.outputs.cluster_region }}
      AZURE_RESOURCE_GROUP: ${{ needs.resolve-deploy.outputs.azure_resource_group }}
      REACT_APP: ${{ inputs.REACT_APP }}
      ENV_FILE_PATH_EXPLICIT: ${{ needs.resolve-deploy.outputs.env_file_explicit == 'true' }}
    secrets:
      CLUSTER_CREDENTIALS: ${{ secrets.STAGE_CLUSTER_CREDENTIALS || secrets.CLUSTER_CREDENTIALS || secrets.STAGE_DEPLOY_KEY || secrets.DEPLOY_KEY }}
