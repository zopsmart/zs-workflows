name: "checkout and build"
on:
  workflow_call:
    secrets:
      GH_USERNAME:
        description: 'required input'
        required: true

      GH_PASSWORD:
        description: 'required input'
        required: true


jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ (github.base_ref == 'refs/heads/development' || github.base_ref == 'refs/heads/main'  || github.base_ref == 'refs/heads/master' || github.event_name == 'pull_request') && !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: 11.0.10
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build with Gradle
        run: ./gradlew clean build
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PASSWORD: ${{ secrets.GH_PASSWORD }}