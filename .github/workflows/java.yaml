name: "checkout and build"
on:
  workflow_call:
    secrets:
      GAR_SECRET:
        description: 'required input'
        required: true


jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ (github.base_ref == 'refs/heads/development' || github.base_ref == 'refs/heads/main'  || github.base_ref == 'refs/heads/master' || github.event_name == 'pull_request') && !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: 11.0.10
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setting Project ID as env
        run: |
          echo '${{ secrets.GAR_SECRET }}' > credentials.json
          PROJECT_ID=$(jq -r '.project_id' credentials.json)
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          
      - name: Login to GAR with rocket dependencies
        uses: docker/login-action@v2
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GAR_SECRET }}

      - name: Build Gradle from GAR
        run: ./gradlew clean build
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}