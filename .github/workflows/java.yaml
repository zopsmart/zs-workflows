name: 🧪 Test, 🔨 Build, and 🐳 Dockerize
on:
  workflow_call:
    outputs:
      IMAGE:
        description: "Dockerize Image"
        value: ${{ jobs.test.outputs.image }}
      ONLY_CONFIGMAP:
        description: "Whether only configmap values are updated"
        value: ${{ jobs.test.outputs.only_configmap }}
      ONLY_DEPLOYMENT:
        description: "Whether only deployment should happen"
        value: ${{ jobs.test.outputs.only_deployment }}

    inputs:
      APP_NAME:
        description: 'name of java service'
        required: true
        type: string
      BUILD_ARGUMENTS:
        description: 'build arguments for DockerFile'
        required: false
        type: string
      DOCKER_FILE_PATH:
        description: 'path of docker file'
        required: true
        type: string
      IMAGE_REGISTRY:
        type: string
        required: true
      GAR_PROJECT:
        type: string
        required: true
      GAR_REGISTRY:
        type: string
        required: true
      STAGE_ENV_FILE_PATH:
        description: 'env file path'
        required: false
        type: string
        default: "./configs/.stage.env"
      PROD_ENV_FILE_PATH:
        description: 'env file path'
        required: false
        type: string
        default: "./configs/.prod.env"


    secrets:
      GAR_KEY:
        description: 'required input'
        required: true
      GH_USERNAME:
        description: 'required input'
        required: true
      GH_PASSWORD:
        description: 'required input'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main'  || github.ref == 'refs/heads/master' || github.event_name == 'pull_request') && !startsWith(github.ref, 'refs/tags/v') }}
    outputs:
      image: ${{ steps.output-image.outputs.image }}
      only_configmap: ${{ steps.vars.outputs.only_configmap }}
      only_deployment: ${{ steps.vars.outputs.only_deployment }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Find Modified Files
        id: files
        uses: masesgroup/retrieve-changed-files@v2

      - name: Print Modified Files
        run: |
          for added_modified_file in ${{ steps.files.outputs.all }}; do
              echo "$added_modified_file"
          done

      - name: Check modified files
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            if [[ "${{ github.base_ref }}" == 'main' || "${{ github.base_ref }}" == 'master' ]]; then
              path="${{ inputs.PROD_ENV_FILE_PATH }}"
            else
              path="${{ inputs.STAGE_ENV_FILE_PATH }}"
            fi
          else
            if [[ "${{ github.ref }}" == 'refs/heads/main' || "${{ github.ref }}" == 'refs/heads/master' ]]; then
              path="${{ inputs.PROD_ENV_FILE_PATH }}"
            else
              path="${{ inputs.STAGE_ENV_FILE_PATH }}"
            fi
          fi
          file_path="$path"
          file="${file_path#./}"
          file="${file#/}"
          if echo "${{ steps.files.outputs.all }}" | grep -q "$file"; then
            only_configmap=true
          else
            only_configmap=false
          fi          
          dir=$(dirname "$file")
          echo "$dir"
          only_deployment=false
          for added_modified_file in ${{ steps.files.outputs.all }}; do
            if [[  "$added_modified_file" != *"$dir"* ]]; then
              only_deployment=true
              break
            fi
          done

          echo "only_configmap=$only_configmap" >> "$GITHUB_OUTPUT"
          echo "only_deployment=$only_deployment" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up JDK 11
        if: ${{ steps.vars.outputs.only_deployment == 'true' }}
        uses: actions/setup-java@v1
        with:
          java-version: 11.0.10

      - name: Build with Gradle
        if: ${{ steps.vars.outputs.only_deployment == 'true' }}
        run: ./gradlew clean build
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PASSWORD: ${{ secrets.GH_PASSWORD }}

      - name: Login to GAR
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && (github.event_name == 'push') && steps.vars.outputs.only_deployment == 'true' }}
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.IMAGE_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GAR_KEY }}

      - name: Push Docker Image to GAR
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && (github.event_name == 'push') && steps.vars.outputs.only_deployment == 'true' }}
        uses: docker/build-push-action@v2
        with:
          push: true
          context: .
          file: ${{ inputs.DOCKER_FILE_PATH }}
          tags: ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ github.sha }}
          build-args: |
            ${{ inputs.BUILD_ARGUMENTS }}

      - id: output-image
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && (github.event_name == 'push') && steps.vars.outputs.only_deployment == 'true' }}
        run: echo "image=`echo  ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ github.sha }}`" >> "$GITHUB_OUTPUT"