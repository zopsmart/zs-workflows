name: "Stage Deployment and Update-configmap"
on:
  workflow_call:
    inputs:
      APP_NAME:
        description: 'name of postman collection file'
        required: true
        type: string
      JDK_VERSION:
        description: 'jdk version'
        required: false
        type: string
        default: '11.0.10'
      TYPE:
        type: string
        description: "deployment or cron"
        required: true
      CLUSTER_PROJECT:
        type: string
        required: true
      CLUSTER_NAME:
        type: string
        required: false
        default: ''
      CLUSTER_REGION:
        type: string
        required: true
      NAMESPACE:
        type: string
        required: true
      IMAGE_REGISTRY:
        type: string
        required: true
      GAR_PROJECT:
        type: string
        required: true
      GAR_REGISTRY:
        type: string
        required: true
      DOCKER_FILE_PATH:
        description: 'path of docker file'
        required: true
        type: string
      BUILD_ARGUMENTS:
        description: 'build arguments for DockerFile'
        required: false
        type: string

    secrets:
      PAT:
        description: 'pat for helm'
        required: false
      GAR_KEY:
        description: 'gar key'
        required: true
      GAR_SECRET:
        description: 'required input'
        required: true

jobs:
  build_dockerize:
    runs-on: ubuntu-latest
    name: 🔨 Build and 🐳 Dockerize
    if: (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main') && (!startsWith(github.ref, 'refs/tags/v'))
    outputs:
      image: ${{ steps.output-image.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Latest Commit Hash
        id: output-sha
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
        run: |
          if [ "${{ github.event_name }}" == 'push' ] && [ \( "${{ github.ref }}" = 'refs/heads/main' \) ]; then
            sha=$(git rev-parse HEAD)
          else
            sha="${{ github.sha }}"
          fi
          echo "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 11
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
        uses: actions/setup-java@v1
        with:
          java-version: '${{ inputs.JDK_VERSION }}'

      - name: Setting Project ID as env
        run: |
          echo '${{ secrets.GAR_SECRET }}' > credentials.json
          PROJECT_ID=$(jq -r '.project_id' credentials.json)
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
      
      - name: Authorize to GCP service account to pull rocket packages from GAR
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GAR_SECRET }}

      - name: Build Gradle from GAR
        run: ./gradlew clean build
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}

      - name: Login to GAR
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.IMAGE_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GAR_KEY }}

      - name: Push Docker Image to GAR
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && (github.event_name == 'push')
        uses: docker/build-push-action@v2
        with:
          push: true
          context: .
          file: ${{ inputs.DOCKER_FILE_PATH }}
          tags: ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ steps.output-sha.outputs.sha }}
          build-args: |
            ${{ inputs.BUILD_ARGUMENTS }}

      - id: output-image
        if: (github.ref == 'refs/heads/development') && (github.event_name == 'push')
        run: echo "image=`echo ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ steps.output-sha.outputs.sha }}`" >> "$GITHUB_OUTPUT"

  stage_deployment:
    runs-on: ubuntu-latest
    needs: [ build_dockerize ]
    if: ${{ inputs.CLUSTER_NAME != '' && (github.ref == 'refs/heads/development') }}
    container:
      image: ghcr.io/zopsmart/gha-images:deployments-0.1.4
      options: --rm
    name: 🚀 Stage Deployment and Update Configmap
    env:
      image: ${{ needs.build_dockerize.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authorize to GCP service account
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GAR_KEY }}

      - name: Set GCloud Project and Fetch Cluster Credentials
        run: gcloud container clusters get-credentials ${{ inputs.CLUSTER_NAME }} --region=${{ inputs.CLUSTER_REGION }} --project=${{ inputs.CLUSTER_PROJECT }}

      - name: Update Deployment Image using Kubectl
        if: ${{ inputs.TYPE == 'deployment' }}
        run: kubectl set image deployment/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ env.image }} --namespace ${{ inputs.NAMESPACE }}

      - name: Update Cron Image
        if: ${{ inputs.TYPE == 'cron' }}
        run: kubectl set image cronjobs/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ env.image }} --namespace ${{ inputs.NAMESPACE }}