name: "Stage Deployment and Update-configmap"
on:
  workflow_call:
    inputs:
      APP_NAME:
        description: 'name of postman collection file'
        required: true
        type: string
      TYPE:
        type: string
        description: "deployment or cron"
        required: true
      CLUSTER_PROJECT:
        type: string
        required: true
      CLUSTER_NAME:
        type: string
        required: false
        default: ''
      CLUSTER_REGION:
        type: string
        required: true
      STAGE_NAMESPACE:
        type: string
        required: true
      PROD_NAMESPACE:
        type: string
        required: true
      IMAGE_REGISTRY:
        type: string
        required: true
      GAR_PROJECT:
        type: string
        required: true
      GAR_REGISTRY:
        type: string
        required: true
      DOCKER_FILE_PATH:
        description: 'path of docker file'
        required: true
        type: string
      BUILD_ARGUMENTS:
        description: 'build arguments for DockerFile'
        required: false
        type: string
      STAGE_ENV_FILE_PATH:
        description: 'env file path'
        required: false
        type: string
        default: "./configs/.stage.env"
      PROD_ENV_FILE_PATH:
        description: 'env file path'
        required: false
        type: string
        default: "./configs/.prod.env"
      REACT_APP:
        description: 'for react service'
        type: boolean
        required: false
        default: false

    secrets:
      PAT:
        description: 'pat for helm'
        required: false
      GAR_KEY:
        description: 'gar key'
        required: true
      GAR_SECRET:
        description: 'required input'
        required: true

jobs:
  build_dockerize:
    runs-on: ubuntu-latest
    name: 🔨 Build and 🐳 Dockerize
    if: (github.ref == 'refs/heads/main') && (!startsWith(github.ref, 'refs/tags/v'))
    outputs:
      image: ${{ steps.output-image.outputs.image }}
      deployment: ${{ steps.vars.outputs.deployment }}
      configmap: ${{ steps.vars.outputs.configmap }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Find Modified Files
        id: files
        uses: masesgroup/retrieve-changed-files@v2

      - name: Print Modified Files
        run: |
          for added_modified_file in ${{ steps.files.outputs.all }}; do
              echo "$added_modified_file"
          done

      - name: Check modified files
        id: vars
        run: |
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
              path="${{ inputs.PROD_ENV_FILE_PATH }}"
          else
              path="${{ inputs.STAGE_ENV_FILE_PATH }}"
          fi
          file_path="$path"
          file="${file_path#./}"
          file="${file#/}"
          if echo "${{ steps.files.outputs.all }}" | grep -q "$file"; then
            configmap=true
          else
            configmap=false
          fi          
          deployment=false
          for added_modified_file in ${{ steps.files.outputs.all }}; do
              file="$added_modified_file"
              if [[ $file != *".stage.env"*  && $file != *".prod.env"* ]]; then
                deployment=true
                break
              fi
          done
          echo "$configmap"
          echo "$deployment"

          echo "configmap=$configmap" >> "$GITHUB_OUTPUT"
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Latest Commit Hash
        id: output-sha
        if: ${{ ((github.ref == 'refs/heads/main') && (github.event_name == 'push')) && steps.vars.outputs.deployment == 'true' }}
        run: |
          if [ "${{ github.event_name }}" == 'push' ] && [ \( "${{ github.ref }}" = 'refs/heads/main' \) ]; then
            sha=$(git rev-parse HEAD)
          else
            sha="${{ github.sha }}"
          fi
          echo "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 11
        if: ${{ (github.ref == 'refs/heads/main') && (github.event_name == 'push') && steps.vars.outputs.deployment == 'true' }}
        uses: actions/setup-java@v1
        with:
          java-version: 11.0.10

      - name: Setting Project ID as env
        run: |
          echo '${{ secrets.GAR_SECRET }}' > credentials.json
          PROJECT_ID=$(jq -r '.project_id' credentials.json)
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
      
      - name: Authorize to GCP service account to pull rocket packages from GAR
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GAR_SECRET }}

      - name: Build Gradle from GAR
        run: ./gradlew clean build
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}

      - name: Login to GAR
        if: ${{ (github.ref == 'refs/heads/main') && (github.event_name == 'push') && steps.vars.outputs.deployment == 'true' }}
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.IMAGE_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GAR_KEY }}

      - name: Push Docker Image to GAR
        if: ${{ (github.ref == 'refs/heads/main') && (github.event_name == 'push') && steps.vars.outputs.deployment == 'true' }}
        uses: docker/build-push-action@v2
        with:
          push: true
          context: .
          file: ${{ inputs.DOCKER_FILE_PATH }}
          tags: ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ steps.output-sha.outputs.sha }}
          build-args: |
            ${{ inputs.BUILD_ARGUMENTS }}

      - id: output-image
        if: ${{ (github.ref == 'refs/heads/main') && (github.event_name == 'push') && steps.vars.outputs.deployment == 'true' }}
        run: echo "image=`echo ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ steps.output-sha.outputs.sha }}`" >> "$GITHUB_OUTPUT"

  stage_deployment:
    runs-on: ubuntu-latest
    needs: [ build_dockerize ]
    if: ${{ inputs.CLUSTER_NAME != '' && (github.ref == 'refs/heads/main') && needs.build_dockerize.outputs.deployment == 'true' }}
    container:
      image: ghcr.io/zopsmart/gha-images:deployments-0.1.4
      options: --rm
    name: 🚀 Stage Deployment and Update Configmap
    env:
      image: ${{ needs.build_dockerize.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authorize to GCP service account
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GAR_KEY }}

      - name: Set GCloud Project and Fetch Cluster Credentials
        run: gcloud container clusters get-credentials ${{ inputs.CLUSTER_NAME }} --region=${{ inputs.CLUSTER_REGION }} --project=${{ inputs.CLUSTER_PROJECT }}

      - name: Update Deployment Image using Kubectl
        if: ${{ inputs.TYPE == 'deployment' }}
        run: kubectl set image deployment/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ env.image }} --namespace ${{ inputs.STAGE_NAMESPACE }}

      - name: Update Cron Image
        if: ${{ inputs.TYPE == 'cron' }}
        run: kubectl set image cronjobs/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ env.image }} --namespace ${{ inputs.STAGE_NAMESPACE }}

      - name: Read ENV Files
        run: |
          CONFIG_MAP_NAME=${{ inputs.APP_NAME }}
          ENV_FILE_PATH=${{ inputs.STAGE_ENV_FILE_PATH }}

          # Create an associative array to store key-value pairs
          declare -A envArray

          # Read each line in .env and extract key-value pairs
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [ -z "$line" ] || [ "${line:0:1}" == "#" ]; then
              continue
            fi
            key=$(echo "$line" | cut -d '=' -f 1)
            value=$(echo "$line" | cut -d '=' -f 2-)
            envArray["$key"]=$value
          done < "$ENV_FILE_PATH"

          # Handle the case when the last line doesn't end with a newline character
          if [[ -n "$line" ]]; then
            key=$(echo "$line" | cut -d '=' -f 1)
            value=$(echo "$line" | cut -d '=' -f 2-)
            envArray["$key"]=$value
          fi
          react="${{ inputs.REACT_APP }}"

          # Read the .env file and create a ConfigMap YAML dynamically
          echo "apiVersion: v1" > $CONFIG_MAP_NAME.yaml
          echo "kind: ConfigMap" >> $CONFIG_MAP_NAME.yaml
          echo "metadata:" >> $CONFIG_MAP_NAME.yaml
          echo "  name: $CONFIG_MAP_NAME" >> $CONFIG_MAP_NAME.yaml
          echo "data:" >> $CONFIG_MAP_NAME.yaml
          if [[ $react == "true" ]]; then
            echo "  environment.js: |" >> $CONFIG_MAP_NAME.yaml
            echo "    if (typeof window !== 'undefined')" >> $CONFIG_MAP_NAME.yaml
            echo "    window.env = {" >> $CONFIG_MAP_NAME.yaml
            for key in "${!envArray[@]}"; do
              echo "      $key: "${envArray[$key]}"," >> $CONFIG_MAP_NAME.yaml
            done
            echo "    }" >> $CONFIG_MAP_NAME.yaml
          else
            for key in "${!envArray[@]}"; do
              echo "  $key: ${envArray[$key]}" >> $CONFIG_MAP_NAME.yaml
            done
          fi
        shell: bash

      - name: Update configmap
        run: kubectl apply --force -f ${{ inputs.APP_NAME }}.yaml -n ${{ inputs.STAGE_NAMESPACE }}

  update_configmap:
    runs-on: ubuntu-latest
    name: Update Only Configmap
    needs: build_dockerize
    container:
      image: ghcr.io/zopsmart/gha-images:deployments-0.1.4
      options: --rm
    if: ${{ inputs.CLUSTER_NAME != '' && needs.build_dockerize.outputs.configmap == 'true' && needs.build_dockerize.outputs.deployment != 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authorize to GCP service account
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GAR_KEY }}

      - name: Set GCloud Project and Fetch Cluster Credentials
        run: gcloud container clusters get-credentials ${{ inputs.CLUSTER_NAME }} --region=${{ inputs.CLUSTER_REGION }} --project=${{ inputs.CLUSTER_PROJECT }}

      - name: Read ENV Files
        run: |
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
              path="${{ inputs.PROD_ENV_FILE_PATH }}"
              namespace="${{ inputs.PROD_NAMESPACE }}"
          else
              path="${{ inputs.STAGE_ENV_FILE_PATH }}"
              namespace="${{ inputs.STAGE_NAMESPACE }}"
          fi
          CONFIG_MAP_NAME=${{ inputs.APP_NAME }}
          ENV_FILE_PATH=$path

          # Create an associative array to store key-value pairs
          declare -A envArray

          # Read each line in .env and extract key-value pairs
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [ -z "$line" ] || [ "${line:0:1}" == "#" ]; then
              continue
            fi
            key=$(echo "$line" | cut -d '=' -f 1)
            value=$(echo "$line" | cut -d '=' -f 2-)
            envArray["$key"]=$value
          done < "$ENV_FILE_PATH"

          # Handle the case when the last line doesn't end with a newline character
          if [[ -n "$line" ]]; then
            key=$(echo "$line" | cut -d '=' -f 1)
            value=$(echo "$line" | cut -d '=' -f 2-)
            envArray["$key"]=$value
          fi
          react="${{ inputs.REACT_APP }}"

          # Read the .env file and create a ConfigMap YAML dynamically
          echo "apiVersion: v1" > $CONFIG_MAP_NAME.yaml
          echo "kind: ConfigMap" >> $CONFIG_MAP_NAME.yaml
          echo "metadata:" >> $CONFIG_MAP_NAME.yaml
          echo "  name: $CONFIG_MAP_NAME" >> $CONFIG_MAP_NAME.yaml
          echo "data:" >> $CONFIG_MAP_NAME.yaml
          if [[ $react == "true" ]]; then
            echo "  environment.js: |" >> $CONFIG_MAP_NAME.yaml
            echo "    if (typeof window !== 'undefined')" >> $CONFIG_MAP_NAME.yaml
            echo "    window.env = {" >> $CONFIG_MAP_NAME.yaml
            for key in "${!envArray[@]}"; do
              echo "      $key: "${envArray[$key]}"," >> $CONFIG_MAP_NAME.yaml
            done
            echo "    }" >> $CONFIG_MAP_NAME.yaml
          else
            for key in "${!envArray[@]}"; do
              echo "  $key: ${envArray[$key]}" >> $CONFIG_MAP_NAME.yaml
            done
          fi
        shell: bash

      - name: Update configmap
        run: |
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
              namespace="${{ inputs.PROD_NAMESPACE }}"
          else
              namespace="${{ inputs.STAGE_NAMESPACE }}"
          fi
          kubectl apply --force -f ${{ inputs.APP_NAME }}.yaml -n $namespace
