name: Build and Deploy remote-config-data

on:
  push:
    branches:
      - "development"

env:
  app_name: '<app_name>'
  cluster_name: '<cluster_name>'
  cluster_project_name: '<cluster_project_name>'
  project_name: '<project_name>'
  namespace: '<namespace>'
  DB_NAME: '<db_name>'
  DB_DIALECT: '<db_dialect>'
  DB_USER: '<db_user>'

  GOPRIVATE: developer.zopsmart.com/go/gofr

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.1
        ports:
          - "5432:5432"
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_DB: ${{ env.DB_NAME }}

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Set up Go 1.19
        uses: actions/setup-go@v2
        with:
          go-version: 1.19
          id: Go

      - name: Checkout code into go module directory
        uses: actions/checkout@v2

      - name: Fetch dependencies
        run: |
          git config --global url."https://${{ secrets.PAT }}:x-oauth-basic@github.com/zopsmart".insteadOf "https://github.com/zopsmart"
          git config --global http.sslVerify false
          go mod tidy

      - name: Make Directory
        run: mkdir build

      - name: Test
        run: |
          export GOFR_ENV=test
          go test ./... -short -v -coverprofile build/coverage.txt -coverpkg=./...
          go tool cover -func build/coverage.txt

      - name: Setup linter
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.50.1
          golangci-lint --version
      - name: Linter Check
        run: |
          golangci-lint run --timeout 5m0s

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o main

      - name: Upload Artifacts
        uses: actions/upload-artifact@v2
        with:
          name: artifacts
          path: main

  dockerize:
    runs-on: ubuntu-latest
    name: Dockerize
    needs: build

    outputs:
      image: ${{ steps.output-image.outputs.image }}

    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Download Artifacts
        uses: actions/download-artifact@v2
        with:
          name: artifacts

      - name: change permission
        run: chmod a+x main

      - name: Login to GCR
        uses: docker/login-action@v1
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCR_KEY }}

      - name: Build and Push Docker Image to GCR
        uses: docker/build-push-action@v2
        with:
          push: true
          context: .
          file: ./Dockerfile
          tags: gcr.io/${{ env.cluster_project_name }}/${{ env.app_name }}:${{ github.sha }}
      - id: output-image
        run: echo "image=`echo gcr.io/${{ env.cluster_project_name }}/${{ env.app_name }}:${{ github.sha }}`" >> "$GITHUB_OUTPUT"

  deployment:
    runs-on: ubuntu-latest
    needs: dockerize
    name: Deploy
    env:
      image: ${{needs.dockerize.outputs.image}}

    if: github.ref == 'refs/heads/development' && (github.event_name == 'push')
    steps:

      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Install Helm
        uses: azure/setup-helm@v3
        id: install

      - name: Setup Helm Chart
        run: git clone https://${{ secrets.PAT }}@github.com/zopsmart/helm.git

      - name: Verify
        run: ls -la
      - name: Directory
        run: pwd

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: zopsmart-poc
          service_account_key: ${{ secrets.DEPLOY_KEY }}
          export_default_credentials: true

      - name: Update Kubectl component
        run: gcloud --quiet components update kubectl

      - name: Set GCloud Project and Fetch Cluster Credentials
        run: gcloud container clusters get-credentials ${{ env.cluster_name }}  --region=us-east4 --project=${{ env.project_name}}

      - name: Update Deployment Image
        run: helm upgrade --install --set image=${{ env.image }} ${{ env.app_name }} ./helm/service/ -f ./values.yaml -n ${{ env.namespace }}