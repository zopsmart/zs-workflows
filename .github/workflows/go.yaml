name: 🧪 Test, 🔨 Build, and 🐳 Dockerize
on:
  workflow_call:
    inputs:
      TESTCOVERAGE_THRESHOLD:
        description: 'required input'
        required: true
        type: string
      POSTMAN_ENABLED:
        required: true
        type: boolean
      APP_NAME:
        description: 'name of postman collection file'
        required: true
        type: string
      GO_VERSION:
        description: 'go version'
        required: false
        type: string
        default: '1.20'
      ADD_SCHEMA:
        description: 'enable step to load DB schema'
        required: false
        type: boolean
        default: false
      SCHEMA_COMMAND:
        description: 'command to load DB schema'
        required: false
        type: string
      EXTRA_DEPENDENCIES:
        description: 'enable step to install extra dependencies'
        required: false
        type: boolean
        default: false
      DEPENDENCIES_COMMAND:
        description: 'commands to install extra dependencies'
        required: false
        type: string
      MYSQL_ENABLE:
        required: false
        type: boolean
        default: false
      POSTGRES_ENABLE:
        required: false
        type: boolean
        default: false
      REDIS_ENABLE:
        required: false
        type: boolean
        default: false
      ZIPKIN_ENABLE:
        required: false
        type: boolean
        default: false
      ELASTIC_SEARCH_ENABLE:
        required: false
        type: boolean
        default: false
      KAFKA_ENABLE:
        required: false
        type: boolean
        default: false
      MONGO_ENABLE:
        required: false
        type: boolean
        default: false
      MSSQL_ENABLE:
        required: false
        type: boolean
        default: false
      DYNAMODB_ENABLE:
        required: false
        type: boolean
        default: false
      CASSANDRA_ENABLE:
        required: false
        type: boolean
        default: false
      IMAGE_REGISTRY:
        type: string
        required: true
      GAR_PROJECT:
        type: string
        required: true
      GAR_REGISTRY:
        type: string
        required: true
      DOCKER_FILE_PATH:
        description: 'path of docker file'
        required: true
        type: string
      BUILD_COMMAND:
        description: 'go build command'
        required: true
        type: string
      BUILD_ARGUMENTS:
        description: 'build arguments for DockerFile'
        required: false
        type: string
      STAGE_ENV_FILE_PATH:
        description: 'env file path'
        required: false
        type: string
        default: "./configs/.stage.env"
      PROD_ENV_FILE_PATH:
        description: 'env file path'
        required: false
        type: string
        default: "./configs/.prod.env"


    secrets:
      PAT:
        description: 'required input'
        required: false
      GAR_KEY:
        description: 'required input'
        required: true

    outputs:
      SHA:
        description: "Image tag"
        value: ${{ jobs.test.outputs.sha }}
      ONLY_CONFIGMAP:
        description: "Whether only configmap values are updated"
        value: ${{ jobs.test.outputs.only_configmap }}
      ONLY_DEPLOYMENT:
        description: "Whether only deployment should happen"
        value: ${{ jobs.test.outputs.only_deployment }}


jobs:
  test:
    runs-on: ubuntu-latest
    name: 🧪 Test, 🔨 Build and 🐳 Dockerize
    if: ${{ (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main'  || github.ref == 'refs/heads/master' || github.event_name == 'pull_request') && !startsWith(github.ref, 'refs/tags/v') }}
    outputs:
      sha: ${{ steps.output-sha.outputs.sha }}
      only_configmap: ${{ steps.vars.outputs.only_configmap }}
      only_deployment: ${{ steps.vars.outputs.only_deployment }}
    services:
      mysql:
        image: ${{ inputs.MYSQL_ENABLE && 'mysql:8.0.30' || '' }}
        ports:
          - "3306:3306"
        env:
          MYSQL_DATABASE: "test"
          MYSQL_ROOT_PASSWORD: "password"
          options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      postgres:
        image: ${{ inputs.POSTGRES_ENABLE && 'postgres:15.1' || '' }}
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
          POSTGRES_DB: test

      redis:
        image: ${{ inputs.REDIS_ENABLE && 'redis:5.0.14' || '' }}
        ports:
          - "6379:6379"
        options: "--entrypoint redis-server"

      zipkin:
        image: ${{ inputs.ZIPKIN_ENABLE && 'openzipkin/zipkin' || '' }}
        ports:
          - "9411:9411"

      elasticsearch:
        image: ${{ inputs.ELASTIC_SEARCH_ENABLE && 'elasticsearch:6.8.6' || '' }}
        ports:
          - 2012:9200
          - 2013:9300
          - 9200:9200
        env:
          discovery type: "single-node"

      kafka:
        image: ${{ inputs.KAFKA_ENABLE && 'krisgeus/docker-kafka' || '' }}
        ports:
          - 2008:2008
          - 2009:2009
        env:
          ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:2008,INTERNAL://localhost:2009'
          LISTENERS: 'PLAINTEXT://0.0.0.0:2008,INTERNAL://0.0.0.0:2009'
          SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT'
          INTER_BROKER: 'INTERNAL'
          KAFKA_CREATE_TOPICS: 'test-topic'
          KAFKA_HOSTS: 'localhost:2008,localhost:2009'
          KAFKA_TOPIC: 'test-topic'

      mongo:
        image: ${{ inputs.MONGO_ENABLE && 'mongo:6.0.2' || '' }}
        ports:
          - "27017:27017"
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123

      mssql:
        image: ${{ inputs.MSSQL_ENABLE && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        ports:
          - "1433:1433"
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: reallyStrongPwd123

      dynamodb:
        image: ${{ inputs.DYNAMODB_ENABLE && 'amazon/dynamodb-local' || '' }}
        ports:
          - "2021:8000"

      cassandra:
        image: ${{ inputs.CASSANDRA_ENABLE && 'cassandra:4.0.6' || '' }}
        ports:
          - 9041:9042
        options: --health-cmd "cqlsh --debug"

    steps:
      - uses: actions/checkout@v4

      - name: Find Modified Files
        id: files
        uses: masesgroup/retrieve-changed-files@v2

      - name: Print Modified Files
        run: |
          for added_modified_file in ${{ steps.files.outputs.all }}; do
              echo "$added_modified_file"
          done

      - name: Check modified files
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            if [[ "${{ github.base_ref }}" == 'main' || "${{ github.base_ref }}" == 'master' ]]; then
              path="${{ inputs.PROD_ENV_FILE_PATH }}"
            else
              path="${{ inputs.STAGE_ENV_FILE_PATH }}"
            fi
          else
            if [[ "${{ github.ref }}" == 'refs/heads/main' || "${{ github.ref }}" == 'refs/heads/master' ]]; then
              path="${{ inputs.PROD_ENV_FILE_PATH }}"
            else
              path="${{ inputs.STAGE_ENV_FILE_PATH }}"
            fi
          fi
          file_path="$path"
          file="${file_path#./}"
          file="${file#/}"
          if echo "${{ steps.files.outputs.all }}" | grep -q "$file"; then
            only_configmap=true
          else
            only_configmap=false
          fi          
          dir=$(dirname "$file")
          echo "$dir"
          only_deployment=false
          for added_modified_file in ${{ steps.files.outputs.all }}; do
            if [[  "$added_modified_file" != *"$dir"* ]]; then
              only_deployment=true
              break
            fi
          done

          echo "only_configmap=$only_configmap" >> "$GITHUB_OUTPUT"
          echo "only_deployment=$only_deployment" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/setup-go@v4
        if: ${{ steps.vars.outputs.only_deployment == 'true' }}
        with:
          go-version: '${{ inputs.GO_VERSION }}'

      - name: Add DB Schema
        if: ${{ inputs.ADD_SCHEMA && steps.vars.outputs.only_deployment == 'true' }}
        run: |
          ${{ inputs.SCHEMA_COMMAND }}

      - name: Get dependencies
        if: ${{ steps.vars.outputs.only_deployment == 'true' }}
        run: |
          git config --global url."https://${{ secrets.PAT }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          git config --global http.sslVerify false
          go mod download

      - name: Extra dependencies
        if: ${{ inputs.EXTRA_DEPENDENCIES && steps.vars.outputs.only_deployment == 'true' }}
        run: |
          ${{ inputs.DEPENDENCIES_COMMAND }}

      - name: golangci-lint
        if: ${{ steps.vars.outputs.only_deployment == 'true' }}
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.54.2
          args: --timeout 8m
          skip-pkg-cache: true
          skip-build-cache: true


      - name: Test
        if: ${{ steps.vars.outputs.only_deployment == 'true' }}
        run: |
          mkdir -p temp/build
          GOFR_ENV=test go test ./... -count=1 -v -coverprofile temp/cover.out -coverpkg=./...
          cat temp/cover.out | grep -v "mock_interface" | grep -v "migrations" > temp/coverage.out

      - name: Test Coverage report
        if: ${{ steps.vars.outputs.only_deployment == 'true' }}
        run: |
          go tool cover -func=temp/coverage.out | tee temp/c.out

      - name: Generate and Commit Coverage Badge
        if: ${{ (github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.vars.outputs.only_deployment == 'true' }}
        run: |
          go install github.com/AlexBeauchemin/gobadge@latest
          gobadge -filename=temp/c.out -target=$(pwd)/README.md
          git config --global user.email "action@github.com" && git config --global user.name "GitHub-Action"
          git config --global --add safe.directory /__w/$(basename ${{ github.repository }})/$(basename ${{ github.repository }})
          git diff --quiet --exit-code README.md || git commit README.md -m "updating coverage in README.md"

      - name: Push Coverage Badge
        if: ${{ (github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.vars.outputs.only_deployment == 'true' }}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ github.token }}
          branch: ${{github.ref}}

      - name: Coverage Quality Gate
        if: ${{ steps.vars.outputs.only_deployment == 'true' }}
        run: |
          echo "Quality Gate: checking test coverage is above threshold ..."
          echo "Threshold             : ${{ inputs.TESTCOVERAGE_THRESHOLD }}%"
          totalCoverage=`go tool cover -func=temp/coverage.out | grep 'total:' | grep -Eo '[0-9]+\.[0-9]+'`
          echo "Current test coverage : $totalCoverage %"
          totalInt=${totalCoverage%.*}
          if [ "$totalInt" -ge "${{ inputs.TESTCOVERAGE_THRESHOLD }}" ]; then
              echo "OK"
          else
              echo "Current test coverage is below threshold. Please add more unit tests or adjust threshold to a lower value."
              echo "Failed"
              exit 1
          fi

      - name: Run Server
        if: ${{ inputs.POSTMAN_ENABLED && steps.vars.outputs.only_deployment == 'true' }}
        run: |
          GOFR_ENV=test go run main.go &
          sleep 30

      - name: Install newman and Run Postman Collection
        if: ${{ inputs.POSTMAN_ENABLED && steps.vars.outputs.only_deployment == 'true' }}
        run: |
          npm install -g newman
          newman run postman-collections/${{ inputs.APP_NAME }}.postman-collection.json

      - name: Stop Server
        if: ${{ inputs.POSTMAN_ENABLED && steps.vars.outputs.only_deployment == 'true' }}
        run: pkill main


      - name: Make Directory
        if: ${{ ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && (github.event_name == 'push')) && steps.vars.outputs.only_deployment == 'true' }}
        run: mkdir build

      - name: Build
        if: ${{ ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && (github.event_name == 'push')) && steps.vars.outputs.only_deployment == 'true' }}
        run: |
          cd ${{ inputs.DOCKER_FILE_PATH }}
          ls
          pwd
          ${{ inputs.BUILD_COMMAND }}

      - name: Login to GAR
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && (github.event_name == 'push') && steps.vars.outputs.only_deployment == 'true' }}
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.IMAGE_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GAR_KEY }}

      - name: Push Docker Image to GAR
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && (github.event_name == 'push') && steps.vars.outputs.only_deployment == 'true' }}
        uses: docker/build-push-action@v2
        with:
          push: true
          context: .
          file: ${{ inputs.DOCKER_FILE_PATH }}/Dockerfile
          tags: ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ github.sha }}
          build-args: |
            ${{ inputs.BUILD_ARGUMENTS }}

      - id: output-sha
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && (github.event_name == 'push') && steps.vars.outputs.only_deployment == 'true' }}
        run: echo "sha=`echo ${{ github.sha }}`" >> "$GITHUB_OUTPUT"