name: "Prod Deploy"

on:
  workflow_call:
    inputs:
      # Required inputs
      SVC_NAME:
        description: 'Service name (k8s deployment/cronjob name)'
        required: true
        type: string

      # Optional inputs with defaults
      TYPE:
        description: 'deployment or cron'
        required: false
        type: string
        default: 'deployment'
      DEPLOY_METHOD:
        description: 'kubectl or helm'
        required: false
        type: string
        default: 'kubectl'
      HELM_VALUES_PATH:
        description: 'Path to Helm values file (required if DEPLOY_METHOD=helm)'
        required: false
        type: string
        default: ''
      ENV_FILE_PATH:
        description: 'Path to env file. Empty string skips configmap. Default: configs/.prod.env'
        required: false
        type: string
        default: '__default__'
      REACT_APP:
        description: 'Enable React-specific configmap format'
        required: false
        type: boolean
        default: false

      # Registry inputs (provider-agnostic)
      REGISTRY_TYPE:
        description: 'Registry provider: gar, gcr, ecr, acr, dockerhub, ghcr, custom. Auto-detected from IMAGE_REGISTRY if not provided'
        required: false
        type: string
        default: ''
      IMAGE_REGISTRY:
        description: 'Container registry URL. REGISTRY_TYPE is auto-detected from URL pattern. Required for gar/ecr/acr/custom'
        required: false
        type: string
        default: ''
      REGISTRY_PROJECT:
        description: 'Project/account/namespace within registry. Used for image path construction. Falls back to vars.REGISTRY_PROJECT'
        required: false
        type: string
        default: ''
      REGISTRY_REPO:
        description: 'Repository name within project. Used for image path construction. Falls back to vars.REGISTRY_REPO or vars.APP_NAME'
        required: false
        type: string
        default: ''

      # Cluster auth inputs (multi-cloud)
      CLUSTER_PROJECT:
        description: 'GCP project for cluster. Required for GKE auth. Falls back to vars.CLUSTER_PROJECT'
        required: false
        type: string
        default: ''
      CLUSTER_NAME:
        description: 'Kubernetes cluster name. Required for GKE/EKS/AKS auth. Falls back to vars.CLUSTER_NAME'
        required: false
        type: string
        default: ''
      CLUSTER_REGION:
        description: 'Cluster region. Required for GKE/EKS auth. Falls back to vars.CLUSTER_REGION, then vars.AWS_REGION (default: us-central1)'
        required: false
        type: string
        default: ''
      AZURE_RESOURCE_GROUP:
        description: 'Azure resource group. Required for AKS auth. Falls back to vars.AZURE_RESOURCE_GROUP'
        required: false
        type: string
        default: ''
      NAMESPACE:
        description: 'Kubernetes namespace. Falls back to vars.PROD_NAMESPACE or vars.APP_NAME'
        required: false
        type: string
        default: ''

    secrets:
      PAT:
        description: 'GitHub PAT for Helm repo access'
        required: false
      REGISTRY_CREDENTIALS:
        description: 'Registry auth credentials (auto-detected: GCP SA JSON, AWS JSON, Azure JSON, or password/token)'
        required: false
      PROD_CLUSTER_CREDENTIALS:
        description: 'Prod cluster auth credentials (auto-detected: GCP SA key, AWS JSON, Azure JSON, or base64 kubeconfig)'
        required: false
      CLUSTER_CREDENTIALS:
        description: 'Fallback cluster auth credentials (used if PROD_CLUSTER_CREDENTIALS not provided)'
        required: false
      # Legacy support
      GAR_KEY:
        description: 'Deprecated: Use REGISTRY_CREDENTIALS instead'
        required: false
      PROD_DEPLOY_KEY:
        description: 'Deprecated: Use CLUSTER_CREDENTIALS instead'
        required: false
      DEPLOY_KEY:
        description: 'Deprecated: Use CLUSTER_CREDENTIALS instead'
        required: false

jobs:
  # Resolve registry configuration
  resolve-registry:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_resolve-registry-config.yaml
    with:
      REGISTRY_TYPE: ${{ inputs.REGISTRY_TYPE }}
      IMAGE_REGISTRY: ${{ inputs.IMAGE_REGISTRY }}
      REGISTRY_PROJECT: ${{ inputs.REGISTRY_PROJECT }}
      REGISTRY_REPO: ${{ inputs.REGISTRY_REPO }}

  # Resolve deploy configuration (cluster, namespace, env file)
  resolve-deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_resolve-deploy-config.yaml
    with:
      ENVIRONMENT: prod
      CLUSTER_PROJECT: ${{ inputs.CLUSTER_PROJECT }}
      CLUSTER_NAME: ${{ inputs.CLUSTER_NAME }}
      CLUSTER_REGION: ${{ inputs.CLUSTER_REGION }}
      AZURE_RESOURCE_GROUP: ${{ inputs.AZURE_RESOURCE_GROUP }}
      NAMESPACE: ${{ inputs.NAMESPACE }}
      ENV_FILE_PATH: ${{ inputs.ENV_FILE_PATH }}

  # Retag image with release version
  retag:
    needs: [resolve-registry]
    uses: zopsmart/zs-workflows/.github/workflows/_retag-image.yaml@main
    with:
      SVC_NAME: ${{ inputs.SVC_NAME }}
      REGISTRY_TYPE: ${{ needs.resolve-registry.outputs.registry_type }}
      IMAGE_REGISTRY: ${{ needs.resolve-registry.outputs.image_registry }}
      REGISTRY_PROJECT: ${{ needs.resolve-registry.outputs.registry_project }}
      REGISTRY_REPO: ${{ needs.resolve-registry.outputs.registry_repo }}
      SOURCE_TAG: ${{ github.sha }}
      TARGET_TAG: ${{ github.ref_name }}
    secrets:
      REGISTRY_CREDENTIALS: ${{ secrets.REGISTRY_CREDENTIALS || secrets.GAR_KEY }}

  # Deploy to production
  deploy:
    needs: [resolve-deploy, retag]
    if: |
      needs.retag.outputs.tag_exists == 'true' &&
      needs.resolve-deploy.outputs.cluster_name != ''
    uses: zopsmart/zs-workflows/.github/workflows/_deploy.yaml@main
    with:
      SVC_NAME: ${{ inputs.SVC_NAME }}
      TYPE: ${{ inputs.TYPE }}
      IMAGE: ${{ needs.retag.outputs.image }}
      NAMESPACE: ${{ needs.resolve-deploy.outputs.namespace }}
      ENVIRONMENT: prod
      CLUSTER_PROJECT: ${{ needs.resolve-deploy.outputs.cluster_project }}
      CLUSTER_NAME: ${{ needs.resolve-deploy.outputs.cluster_name }}
      CLUSTER_REGION: ${{ needs.resolve-deploy.outputs.cluster_region }}
      AZURE_RESOURCE_GROUP: ${{ needs.resolve-deploy.outputs.azure_resource_group }}
      DEPLOY_METHOD: ${{ inputs.DEPLOY_METHOD }}
      HELM_VALUES_PATH: ${{ inputs.HELM_VALUES_PATH }}
      APP_VERSION: ${{ github.ref_name }}
    secrets:
      CLUSTER_CREDENTIALS: ${{ secrets.PROD_CLUSTER_CREDENTIALS || secrets.CLUSTER_CREDENTIALS || secrets.PROD_DEPLOY_KEY || secrets.DEPLOY_KEY }}
      PAT: ${{ secrets.PAT }}

  # Update configmap
  update-configmap:
    needs: [resolve-deploy, retag, deploy]
    if: |
      always() &&
      needs.retag.outputs.tag_exists == 'true' &&
      needs.deploy.result == 'success' &&
      needs.resolve-deploy.outputs.env_file_path != '' &&
      needs.resolve-deploy.outputs.cluster_name != ''
    uses: zopsmart/zs-workflows/.github/workflows/_update-configmap.yaml@main
    with:
      SVC_NAME: ${{ inputs.SVC_NAME }}
      NAMESPACE: ${{ needs.resolve-deploy.outputs.namespace }}
      ENV_FILE_PATH: ${{ needs.resolve-deploy.outputs.env_file_path }}
      ENVIRONMENT: prod
      CLUSTER_PROJECT: ${{ needs.resolve-deploy.outputs.cluster_project }}
      CLUSTER_NAME: ${{ needs.resolve-deploy.outputs.cluster_name }}
      CLUSTER_REGION: ${{ needs.resolve-deploy.outputs.cluster_region }}
      AZURE_RESOURCE_GROUP: ${{ needs.resolve-deploy.outputs.azure_resource_group }}
      REACT_APP: ${{ inputs.REACT_APP }}
      ENV_FILE_PATH_EXPLICIT: ${{ needs.resolve-deploy.outputs.env_file_explicit == 'true' }}
    secrets:
      CLUSTER_CREDENTIALS: ${{ secrets.PROD_CLUSTER_CREDENTIALS || secrets.CLUSTER_CREDENTIALS || secrets.PROD_DEPLOY_KEY || secrets.DEPLOY_KEY }}
