name: Build and Deploy Rlog

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

env:
  app_name: '<app_name>'
  gcr_project_name: '<project_name>'
  namespace: '<namespace>'
  cluster_name: '<cluster_name>'
  cluster_project_name: '<cluster_project_name>'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.30
        ports:
          - "3306:3306"
        env:
          MYSQL_ROOT_PASSWORD: "password"

    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/development' && github.event_name == 'push')
    steps:
      - name: Set Node.js 16.x
        uses: actions/setup-node@v3
        with:
          node-version: 16.x

      - name: Checkout code into node module directory
        uses: actions/checkout@v2

      - name: Fetch dependencies
        run: |
          git config --global url."https://${{ secrets.PAT }}:x-oauth-basic@github.com/zopsmart".insteadOf "https://github.com/zopsmart"
          git config --global http.sslVerify false
          yarn install
      - name: Make Directory
        run: mkdir build

      - name: Build
        run: |
          yarn build

      - name: Test
        run: |
           yarn test

      - name: Linter Check
        run: |
          yarn lint

  dockerize:
    runs-on: ubuntu-latest
    name: Dockerize
    needs: build

    outputs:
      image: ${{ steps.output-image.outputs.image }}

    if: github.ref == 'refs/heads/development' && (github.event_name == 'push')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: create env file
        run: |
          mkdir -p configs
          touch configs/.env
          echo "HTTP_PORT=$HTTP_PORT" >> configs/.env
          echo "DB_CLIENT=$DB_CLIENT" >> configs/.env
          echo "CLIENT_ID_GOOGLE==${{fromJSON(secrets.OAUTH_KEY).web.client_id}}"
          echo "ACCESS_CONTROL_ALLOW_HEADERS=$ACCESS_CONTROL_ALLOW_HEADERS" >> configs/.env
          echo "RLOG_API_KEY=$RLOG_API_KEY" >> configs/.env
          echo "EMAIL_SERVICE_DEVELOPER_TOKEN=$EMAIL_SERVICE_DEVELOPER_TOKEN" >> configs/.env
          echo "EMAIL_SERVICE_END_POINT=$EMAIL_SERVICE_END_POINT" >> configs/.env
          echo "REDIRECT_EMAIL=$REDIRECT_EMAIL" >> configs/.env
          echo "EMAIL_SERVICE_ORGANIZATION_ID=$EMAIL_SERVICE_ORGANIZATION_ID" >> configs/.env
          echo "LOKI_QUERIER_URL=$LOKI_QUERIER_URL" >> configs/.env
          echo "LOKI_DISTRIBUTOR_URL=$LOKI_DISTRIBUTOR_URL" >> configs/.env
          cat configs/.env

      - name: Login to GCR
        uses: docker/login-action@v1
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCR_KEY }}

      - name: Build and Push Docker Image to GCR
        uses: docker/build-push-action@v2
        with:
          push: true
          context: .
          file: ./Dockerfile
          tags: gcr.io/${{ env.gcr_project_name }}/${{ env.app_name }}:${{ github.sha }}
          build-args: |
            NPM_TOKEN=${{env.NPM_TOKEN}}
      - id: output-image
        run: echo "image=`echo gcr.io/${{ env.gcr_project_name }}/${{ env.app_name }}:${{ github.sha }}`" >> "$GITHUB_OUTPUT"

  deployment:
    runs-on: ubuntu-latest
    needs: dockerize
    name: Deploy
    env:
      image: ${{needs.dockerize.outputs.image}}

    if: github.ref == 'refs/heads/development' && (github.event_name == 'push')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Install Helm
        uses: azure/setup-helm@v3
        id: install

      - name: Setup Helm Chart
        run: git clone https://${{ secrets.PAT }}@github.com/zopsmart/helm.git

      - name: Verify
        run: ls -la
      - name: Directory
        run: pwd

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: ${{env.cluster_project_name}}
          service_account_key: ${{ secrets.DEPLOY_KEY }}
          export_default_credentials: true

      - name: Update Kubectl component
        run: gcloud --quiet components update kubectl

      - name: Set GCloud Project and Fetch Cluster Credentials
        run: gcloud container clusters get-credentials ${{ env.cluster_name }}  --region=us-east4 --project=${{ env.cluster_project_name }}

      - name: Update Deployment Image
        run: helm upgrade --install --set image=${{ env.image }} ${{ env.app_name }} ./helm/service/ -f ./values.yaml -n ${{ env.namespace }}