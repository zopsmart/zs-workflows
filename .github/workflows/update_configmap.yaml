name: "Update configmap"
on:
  workflow_call:
    secrets:
      GAR_KEY:
        description: 'required input'
        required: true
    inputs:
      APP_NAME:
        description: 'name of configmap'
        required: true
        type: string
      STAGE_NAMESPACE:
        type: string
        required: true
      PROD_NAMESPACE:
        type: string
        required: true
      STAGE_ENV_FILE_PATH:
        description: 'env file path'
        required: false
        type: string
        default: "./configs/.stage.env"
      PROD_ENV_FILE_PATH:
        description: 'env file path'
        required: false
        type: string
        default: "./configs/.stage.env"
      CLUSTER_PROJECT:
        type: string
        required: true
      CLUSTER_NAME:
        type: string
        required: true
      REACT_APP:
        description: 'for react service'
        type: boolean
        required: false
        default: false
jobs:
  check_modified_file:
    runs-on: ubuntu-latest
    outputs:
      modified_file: ${{ steps.check_files.outputs.modified_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 2

      # Check if .stage.env or .prod.env is in the modified files
      - name: Check for Modified ConfigMap Files
        id: check_files
        run: |
          if [[ $(git diff --name-only ${{ github.event.before }}..${{ github.sha }} | grep -E '\.(prod|stage)\.env') ]]; then
             echo "modified_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "modified_files=false" >> "$GITHUB_OUTPUT"
          fi

  update_configmap:
    runs-on: ubuntu-latest
    needs: check_modified_file
    if: ${{ needs.check_modified_file.outputs.modified_file == 'true'}}
    container:
      image: ghcr.io/zopsmart/gha-images:deployments-0.1.3
      options: --rm
    name: Update Configmap

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Authorize to GCP service account
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GAR_KEY }}

      - name: Set GCloud Project and Fetch Cluster Credentials
        run: gcloud container clusters get-credentials ${{ inputs.CLUSTER_NAME }} --region=us-central1 --project=${{ inputs.CLUSTER_PROJECT }}

      - id: vars
        run: |
          if [ "${{ github.ref }}" = 'refs/heads/development' ]; then
            echo "file_path=${{ inputs.STAGE_ENV_FILE_PATH }}" >> "$GITHUB_OUTPUT"
            echo "namespace=${{ inputs.STAGE_NAMESPACE }}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.ref }}" = 'refs/heads/main' ] || [ "${{ github.ref }}" == 'refs/heads/master' ]; then
            echo "file_path=${{ inputs.PROD_ENV_FILE_PATH }}" >> "$GITHUB_OUTPUT"
            echo "namespace=${{ inputs.PROD_NAMESPACE }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Read ENV Files
        if: ${{ !inputs.REACT_APP }}
        id: read-env
        run: |
          CONFIG_MAP_NAME=${{ inputs.APP_NAME }}
          ENV_FILE_PATH=${{ steps.vars.outputs.file_path }}

          # Create an associative array to store key-value pairs
          declare -A envArray

          # Read each line in .env and extract key-value pairs
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [ -z "$line" ] || [ "${line:0:1}" == "#" ]; then
              continue
            fi
            key=$(echo "$line" | cut -d '=' -f 1)
            value=$(echo "$line" | cut -d '=' -f 2-)
            envArray["$key"]=$value
          done < "$ENV_FILE_PATH"

          # Handle the case when the last line doesn't end with a newline character
          if [[ -n "$line" ]]; then
            key=$(echo "$line" | cut -d '=' -f 1)
            value=$(echo "$line" | cut -d '=' -f 2-)
            envArray["$key"]=$value
          fi

          # Read the .env file and create a ConfigMap YAML dynamically
          echo "apiVersion: v1" > $CONFIG_MAP_NAME.yaml
          echo "kind: ConfigMap" >> $CONFIG_MAP_NAME.yaml
          echo "metadata:" >> $CONFIG_MAP_NAME.yaml
          echo "  name: $CONFIG_MAP_NAME" >> $CONFIG_MAP_NAME.yaml
          echo "data:" >> $CONFIG_MAP_NAME.yaml
          for key in "${!envArray[@]}"; do
            echo "  $key: ${envArray[$key]}" >> $CONFIG_MAP_NAME.yaml
          done
        shell: bash

      - name: Configs for React services
        if: ${{ inputs.REACT_APP }}
        run: |
          CONFIG_MAP_NAME=${{ inputs.APP_NAME }}
          ENV_FILE_PATH=${{ steps.vars.outputs.file_path }}

          # Create an associative array to store key-value pairs
          declare -A envArray

          # Read each line in .env and extract key-value pairs
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [ -z "$line" ] || [ "${line:0:1}" == "#" ]; then
              continue
            fi
            key=$(echo "$line" | cut -d '=' -f 1)
            value=$(echo "$line" | cut -d '=' -f 2-)
            envArray["$key"]=$value
          done < "$ENV_FILE_PATH"

          # Handle the case when the last line doesn't end with a newline character
          if [[ -n "$line" ]]; then
            key=$(echo "$line" | cut -d '=' -f 1)
            value=$(echo "$line" | cut -d '=' -f 2-)
            envArray["$key"]=$value
          fi

          # Read the .env file and create a ConfigMap YAML dynamically
          echo "apiVersion: v1" > $CONFIG_MAP_NAME.yaml
          echo "kind: ConfigMap" >> $CONFIG_MAP_NAME.yaml
          echo "metadata:" >> $CONFIG_MAP_NAME.yaml
          echo "  name: $CONFIG_MAP_NAME" >> $CONFIG_MAP_NAME.yaml
          echo "data:" >> $CONFIG_MAP_NAME.yaml
          echo "  environment.js: |" >> $CONFIG_MAP_NAME.yaml
          echo "    window.env = {" >> $CONFIG_MAP_NAME.yaml
          for key in "${!envArray[@]}"; do
            echo "      $key: "${envArray[$key]}"," >> $CONFIG_MAP_NAME.yaml
          done
          echo "    }" >> $CONFIG_MAP_NAME.yaml
        shell: bash

      - name: Update configmap
        run: kubectl apply --force -f ${{ inputs.APP_NAME }}.yaml -n ${{ steps.vars.outputs.namespace }}