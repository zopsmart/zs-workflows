name: "checkout and build"
on:
  workflow_call:
    inputs:
      APP_NAME:
        type: string
        required: true
      IMAGE_REGISTRY:
        type: string
        required: true
      username:
        type: string
        required: true
      PROJECT_NAME:
        type: string
        required: false
      NAMESPACE:
        description: 'required input'
        required: true
        type: string
      CLUSTER_NAME:
        description: 'required input'
        required: true
        type: string
      CLUSTER_PROJECT:
        description: 'required input'
        required: true
        type: string
      GCR_PROJECT:
        description: 'required input'
        required: true
        type: string
      TYPE:
        type: string
        description: "deployment or cron"
        required: false
        default: deployment
      ARTIFACT_PATH:
        description: "path used for build with respect to main.go file"
        required: false
        type: string
      ARTIFACT_NAME:
        description: "name of the built artifacts"
        required: false
        type: string
      ENV_FILE_PATH:
        description: 'env file path'
        required: false
        type: string
        default: "./configs/.prod.env"
      REACT_APP:
        description: 'for react service'
        type: boolean
        required: false
        default: false

    secrets:
      GCR_KEY:
        description: 'required input'
        required: true

      DEPLOY_KEY:
        description: 'required input'
        required: true

jobs:
  check-tag:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v')}}
    outputs:
      tag_exists: ${{ steps.tag-check.outputs.tag_exists }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authorize to GCP service account
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCR_KEY }}

      - name: Check if tag exists
        id: tag-check
        run: |
          if gcloud container images describe ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GCR_PROJECT }}/${{ inputs.APP_NAME }}:${{ github.sha }} 2>/dev/null; then
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
              echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Print commit has value
        run: |
          echo "${{ github.sha }}"

      - name: Print tag_exists value
        run: |
          echo "${{ steps.tag-check.outputs.tag_exists }}"

  dockerize_prod:
    runs-on: ubuntu-latest
    needs: check-tag
    name: 🐳 Dockerize Prod
    if: ${{ needs.check-tag.outputs.tag_exists == 'true' }}
    outputs:
      image: ${{ steps.output-image.outputs.image }}

    steps:
      - name: Extract Release Tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GCR
        uses: docker/login-action@v1
        with:
          registry: ${{ inputs.IMAGE_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCR_KEY }}

      - name: Re tag and Push Docker Image to GCR
        run: | 
          docker pull gcr.io/${{ inputs.GCR_PROJECT }}/${{ inputs.APP_NAME }}:${{ github.sha }}
          docker tag gcr.io/${{ inputs.GCR_PROJECT }}/${{ inputs.APP_NAME }}:${{ github.sha }} gcr.io/${{ inputs.GCR_PROJECT }}/${{ inputs.APP_NAME }}:${{ env.RELEASE_VERSION }}
          docker push gcr.io/${{ inputs.GCR_PROJECT }}/${{ inputs.APP_NAME }}:${{ env.RELEASE_VERSION }}

      - id: output-image
        run: echo "image=`echo gcr.io/${{ inputs.GCR_PROJECT }}/${{ inputs.APP_NAME }}:${{ env.RELEASE_VERSION }}`" >> "$GITHUB_OUTPUT"

  update_configmap:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    uses: zopsmart/zs-workflows/.github/workflows/update-configmap.yaml@main
    with:
      APP_NAME: ${{ inputs.APP_NAME }}
      ENV_FILE_PATH: ${{ inputs.ENV_FILE_PATH }}
      CLUSTER_PROJECT: ${{ inputs.CLUSTER_PROJECT }}
      CLUSTER_NAME: ${{ inputs.CLUSTER_NAME }}
      NAMESPACE: ${{ inputs.NAMESPACE }}
      REACT_APP: ${{ inputs.REACT_APP }}
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

  prod_deployment:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to Prod
    needs: dockerize_prod
    container:
      image: ghcr.io/zopsmart/gha-images:deployments-0.1.3
      options: --rm
    env:
      image: ${{needs.dockerize_prod.outputs.image}}
    steps:
      - name: Extract Release Tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Authorize to GCP service account
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.DEPLOY_KEY }}

      - name: Set GCloud Project and Fetch Cluster Credentials
        run: gcloud container clusters get-credentials ${{ inputs.CLUSTER_NAME }} --zone=us-central1 --project=${{ inputs.CLUSTER_PROJECT }}

      - name: Update Deployment Image
        if: ${{ inputs.TYPE == 'deployment' }}
        run: kubectl set image deployment/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ env.image }} --namespace ${{ inputs.NAMESPACE }}

      - name: Update Cron Image
        if: ${{ inputs.TYPE == 'cron' }}
        run: kubectl set image cronjobs/${{ inputs.APP_NAME }} ${{ inputs.APP_NAME }}=${{ env.image }} --namespace ${{ inputs.NAMESPACE }}