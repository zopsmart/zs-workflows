name: Build and Deploy inventory-func

on:
  push:
    branches: [ aws-workflow ]
  pull_request:
    branches: [ aws-workflow ]

env:
  app_name: example
  GOPRIVATE: developer.zopsmart.com/go/gofr
  account_id: 477909162816
  namespace: sample
  cluster_name: github-perf
  ecr_repo: example
  region: us-west-2

jobs:
  build:
    runs-on: ubuntu-latest


    services:
      postgres:
        image: postgres:15.1
        ports:
          - "5432:5432"
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
          POSTGRES_DB: health-check

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/aws-workflow' && github.event_name == 'push')
    steps:
      - name: Set up Go 1.19
        uses: actions/setup-go@v2
        with:
          go-version: 1.19
          id: Go

      - name: Checkout code into go module directory
        uses: actions/checkout@v2

      - name: Fetch dependencies
        run: |
          git config --global url."https://${{ secrets.PAT }}:x-oauth-basic@github.com/zopsmart".insteadOf "https://github.com/zopsmart"
          git config --global http.sslVerify false
          go mod tidy
      - name: Make Directory
        run: mkdir build
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o main
      - name: Test
        run: |
          export GOFR_ENV=test
          go test ./... -short -v -coverprofile build/coverage.txt -coverpkg=./...
          go tool cover -func build/coverage.txt
      - name: Setup linter
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.50.1
          golangci-lint --version
      - name: Linter Check
        run: |
          golangci-lint run --timeout 5m0s
      - name: Upload Artifacts
        uses: actions/upload-artifact@v2
        with:
          name: artifacts
          path: main


  dockerize:
    runs-on: ubuntu-latest
    name: Dockerize
    needs: build

    outputs:
      image: ${{ steps.build-push.outputs.image }}

    if: github.ref == 'refs/heads/aws-workflow' && (github.event_name == 'push')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Download Artifacts
        uses: actions/download-artifact@v2
        with:
          name: artifacts
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_SECRET_KEY }}
          aws-region: ${{ env.region }}

      - name: Login to Amazon ECR Private
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: change permission
        run: chmod a+x main

      - name: Build and Push Docker Image to ECR
        id: build-push
        uses: docker/build-push-action@v2
        with:
          push: true
          context: .
          file: ./Dockerfile
          tags: ${{ env.account_id }}.dkr.ecr.${{ env.region }}.amazonaws.com/${{ env.ecr_repo}}:${{ github.sha }}


  deployment:
    runs-on: ubuntu-latest
    needs: dockerize
    name: Deploy
    env:
      image: ${{ needs.dockerize.outputs.image }}

    if: github.ref == 'refs/heads/aws-workflow' && (github.event_name == 'push')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Helm
        uses: azure/setup-helm@v3
        id: install
      - name: Setup Helm Chart
        run: git clone https://${{ secrets.PAT }}@github.com/zopsmart/helm.git
      - name: Verify
        run: ls -la
      - name: Directory
        run: pwd

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_SECRET_KEY }}
          aws-region: ${{ env.region }}

      - name: Update Kubectl component
        run: aws eks update-kubeconfig --region ${{ env.region }} --name ${{ env.cluster_name }}

      - name: Set AWS credentials and Fetch Cluster Credentials
        run: aws eks --region ${{ env.region }} update-kubeconfig --name ${{ env.cluster_name }}

      - name: Update Deployment Image
        run: helm upgrade --install --set image=${{ env.account_id }}.dkr.ecr.${{ env.region }}.amazonaws.com/${{ env.ecr_repo}}:${{ github.sha }} ${{ env.app_name }} ./helm/service/ -f ./values.yaml -n ${{ env.namespace }}