name: "stage deploy"
on:
  workflow_call:
    inputs:
      APP_NAME:
        type: string
        required: true
      IMAGE_REGISTRY:
        type: string
        required: true
      GAR_PROJECT:
        type: string
        required: true
      GAR_REGISTRY:
        type: string
        required: true
      CLUSTER_PROJECT:
        type: string
        required: true
      CLUSTER_NAME:
        type: string
        required: true
      NAMESPACE:
        type: string
        required: true
      HELM_VALUES_PATH:
        type: string
        required: true
      DOCKER_FILE_PATH:
        description: 'path of docker file'
        required: true
        type: string

      BUILD_COMMAND:
        description: 'go build command'
        required: true
        type: string

      ARTIFACT_PATH:
        description: "path used for build with respect to main.go file"
        required: true
        type: string
      SHA:
        type: string
        required: true

    secrets:
      PAT:
        description: 'required input'
        required: true
      GAR_KEY:
        description: 'required input'
        required: true
        


jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zopsmart/gha-images:go-0.1.1
      options: --rm
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.PAT }}
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: change directory
        run: cd ${{ inputs.DOCKER_FILE_PATH }}

      - name: Get dependencies
        run: |
          git config --global url."https://${{ secrets.PAT }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          git config --global http.sslVerify false
          go mod download

      - name: Make Directory
        run: mkdir build

      - name: Build
        run: |
          ${{ inputs.BUILD_COMMAND }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v2
        with:
          name: ${{ inputs.APP_NAME }}
          path: ${{ inputs.ARTIFACT_PATH }}

  dockerize:
    runs-on: ubuntu-latest
    needs: [ build ]
    outputs:
      image: ${{ steps.output-image.outputs.image }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Download Artifacts
        uses: actions/download-artifact@v2
        with:
          name: ${{ inputs.APP_NAME }}

      - name: change permission
        run: chmod a+x main

      - name: Login to GAR
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.IMAGE_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GAR_KEY }}


      - name: Build and Push Docker Image to gar
        uses: docker/build-push-action@v2
        with:
          push: true
          context: .
          file: ${{ inputs.DOCKER_FILE_PATH }}/Dockerfile
          tags:  ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ inputs.SHA }}
      - id: output-image
        run: echo "image=`echo  ${{ inputs.IMAGE_REGISTRY }}/${{ inputs.GAR_PROJECT }}/${{ inputs.GAR_REGISTRY }}/${{ inputs.APP_NAME }}:${{ inputs.SHA }}`" >> "$GITHUB_OUTPUT"

  stage_deployment:
      runs-on: ubuntu-latest
      needs: dockerize
      container:
        image: ghcr.io/zopsmart/gha-images:deployments-0.1.3
        options: --rm
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}
      name: 🚀 Deploy Stage
      env:
        image: ${{needs.dockerize.outputs.image}}

      steps:
        - name: Checkout Code
          uses: actions/checkout@v2

        - name: Setup Helm Chart
          run: git clone https://${{ secrets.PAT }}@github.com/zopsmart/helm.git

        - name: Setup Cloud SDK
          uses: google-github-actions/setup-gcloud@v0
          with:
            project_id: ${{ inputs.CLUSTER_PROJECT }}
            service_account_key: ${{ secrets.GAR_KEY }}
            export_default_credentials: true

        - name: Set GCloud Project and Fetch Cluster Credentials
          run: gcloud container clusters get-credentials ${{ inputs.CLUSTER_NAME }} --region=us-central1 --project=${{ inputs.CLUSTER_PROJECT }}

        - name: Update Deployment Image
          run: helm upgrade --install --set image=${{ env.image }} ${{ inputs.APP_NAME }} ./helm/service/ -f ${{ inputs.HELM_VALUES_PATH }} -n ${{ inputs.NAMESPACE }}
